name: Dependabot Auto Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ((github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot') || startsWith(github.head_ref, 'janitor/')) && github.event.pull_request.base.ref == 'dev'
    steps:
      - name: Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          skip-commit-verification: true

      - name: Enable auto-merge for Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{github.event.pull_request.html_url}}
        run: |
          required_checks=("overrides-check" "build")
          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            checks_json="$(gh api "/repos/${REPO}/commits/${SHA}/check-runs?per_page=100")"
            waiting=0
            failed=0
            missing=0

            for check_name in "${required_checks[@]}"; do
              status="$(echo "$checks_json" | jq -r --arg n "$check_name" '.check_runs | map(select(.name == $n)) | sort_by(.started_at // .created_at) | last | .status // "missing"')"
              conclusion="$(echo "$checks_json" | jq -r --arg n "$check_name" '.check_runs | map(select(.name == $n)) | sort_by(.started_at // .created_at) | last | .conclusion // "missing"')"

              if [[ "$status" == "missing" ]]; then
                echo "Waiting for check '$check_name' to appear..."
                missing=1
                continue
              fi

              if [[ "$status" != "completed" ]]; then
                echo "Waiting for check '$check_name' (status=$status)..."
                waiting=1
                continue
              fi

              if [[ "$conclusion" != "success" ]]; then
                echo "Required check '$check_name' failed (conclusion=$conclusion)."
                failed=1
              else
                echo "Required check '$check_name' passed."
              fi
            done

            if [[ "$failed" -eq 1 ]]; then
              exit 1
            fi

            if [[ "$missing" -eq 0 && "$waiting" -eq 0 ]]; then
              break
            fi

            sleep 15
          done

          if (( SECONDS >= deadline )); then
            echo "Timed out waiting for required checks to complete."
            exit 1
          fi

          gh pr merge --merge --delete-branch "$PR_URL"

      - name: Enable auto-merge for Janitor PRs
        if: startsWith(github.head_ref, 'janitor/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{github.event.pull_request.html_url}}
        run: |
          required_checks=("overrides-check" "build")
          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            checks_json="$(gh api "/repos/${REPO}/commits/${SHA}/check-runs?per_page=100")"
            waiting=0
            failed=0
            missing=0

            for check_name in "${required_checks[@]}"; do
              status="$(echo "$checks_json" | jq -r --arg n "$check_name" '.check_runs | map(select(.name == $n)) | sort_by(.started_at // .created_at) | last | .status // "missing"')"
              conclusion="$(echo "$checks_json" | jq -r --arg n "$check_name" '.check_runs | map(select(.name == $n)) | sort_by(.started_at // .created_at) | last | .conclusion // "missing"')"

              if [[ "$status" == "missing" ]]; then
                echo "Waiting for check '$check_name' to appear..."
                missing=1
                continue
              fi

              if [[ "$status" != "completed" ]]; then
                echo "Waiting for check '$check_name' (status=$status)..."
                waiting=1
                continue
              fi

              if [[ "$conclusion" != "success" ]]; then
                echo "Required check '$check_name' failed (conclusion=$conclusion)."
                failed=1
              else
                echo "Required check '$check_name' passed."
              fi
            done

            if [[ "$failed" -eq 1 ]]; then
              exit 1
            fi

            if [[ "$missing" -eq 0 && "$waiting" -eq 0 ]]; then
              break
            fi

            sleep 15
          done

          if (( SECONDS >= deadline )); then
            echo "Timed out waiting for required checks to complete."
            exit 1
          fi

          gh pr merge --merge --delete-branch "$PR_URL"
