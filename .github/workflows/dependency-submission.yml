name: Dependency Submission

on:
  push:
    branches:
      - dev

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Validate security override files
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/sync_security_overrides.sh
          .github/scripts/sync_security_overrides.sh --check

      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v6
        with:
          additional-arguments: -I gradle/security-overrides.init.gradle
