name: Security Guard

on:
  pull_request:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  overrides-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate security overrides are up-to-date
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Dependabot/App PR token cannot query Dependabot alerts API in this context.
          # Keep PR check green while still enforcing file presence.
          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "app/dependabot" ]]; then
            test -f gradle/security-overrides.properties
            test -f gradle/security-overrides.init.gradle
            {
              echo "## Security guard note"
              echo ""
              echo "- Dependabot PR detected (${PR_AUTHOR})"
              echo "- Skipped remote Dependabot alerts sync check to avoid token-scope 403 in pull_request context"
              echo "- Verified security override files exist"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          chmod +x .github/scripts/sync_security_overrides.sh
          .github/scripts/sync_security_overrides.sh --check

      - name: Print open security alert summary
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Skip for Dependabot PRs to avoid token-scope 403
          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "app/dependabot" ]]; then
            {
              echo "## Security alert snapshot"
              echo ""
              echo "- Status: Skipped for Dependabot PR (403 restriction)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          repo="${{ github.repository }}"
          if ! gh api --paginate "/repos/${repo}/dependabot/alerts?state=open&per_page=100" > /tmp/dependabot-alerts.jsonl 2>/dev/null; then
            echo "[]" > /tmp/dependabot-alerts.json
          else
            jq -s 'add // []' /tmp/dependabot-alerts.jsonl > /tmp/dependabot-alerts.json 2>/dev/null || echo '[]' > /tmp/dependabot-alerts.json
          fi

          # Double check we have an array of objects
          if [[ "$(jq 'type' /tmp/dependabot-alerts.json)" != "\"array\"" ]]; then
            echo "[]" > /tmp/dependabot-alerts.json
          fi

          total="$(jq 'length' /tmp/dependabot-alerts.json)"
          # Filter only valid alert objects
          high="$(jq '[.[] | select(objects and .security_advisory.severity=="high")] | length' /tmp/dependabot-alerts.json)"
          medium="$(jq '[.[] | select(objects and .security_advisory.severity=="medium")] | length' /tmp/dependabot-alerts.json)"
          low="$(jq '[.[] | select(objects and .security_advisory.severity=="low")] | length' /tmp/dependabot-alerts.json)"
          {
            echo "## Security alert snapshot"
            echo ""
            echo "- Total: ${total}"
            echo "- High: ${high}"
            echo "- Medium: ${medium}"
            echo "- Low: ${low}"
          } >> "$GITHUB_STEP_SUMMARY"
