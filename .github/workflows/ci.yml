name: CI
permissions:
  contents: write
  security-events: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  detekt:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Detekt
        continue-on-error: true
        run: ./gradlew --warning-mode all detekt qualityGateDetekt -PminifyDebug -Pkotlin.incremental=false

  test:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Test
        continue-on-error: true
        run: ./gradlew --warning-mode all :common:check :xmsf:testNormalDebugUnitTest :xmsf:testVc105DebugUnitTest testDebugUnitTest -PminifyDebug -Pkotlin.incremental=false -x detekt -x qualityGateDetekt

  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Build
        run: ./gradlew --warning-mode all :app:assembleDebug :mipush:assembleDebug -PbuildSplits -PminifyDebug -Pkotlin.incremental=false

      - name: Build Magisk Module (XMSF normal + MiPush arm64-v8a only)
        run: bash scripts/build_magisk_module.sh

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| App | File | Size |"
            echo "| --- | --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              app=$(printf '%s\n' "$apk" | awk -F/ '{print $1}')
              echo "| $app | $name | $size |"
            done < <(find app/build/outputs/apk mipush/build/outputs/apk -path '*/debug/*.apk' -not -path '*/androidTest/*' | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload XMSF Normal Debug APK (arm64-v8a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-arm64-v8a
          path: app/build/outputs/apk/normal/debug/**/*arm64-v8a*.apk
      - name: Upload XMSF vc105 Debug APK (arm64-v8a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-arm64-v8a
          path: app/build/outputs/apk/vc105/debug/**/*arm64-v8a*.apk
      - name: Upload XMSF Normal Debug APK (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-armeabi-v7a
          path: app/build/outputs/apk/normal/debug/**/*armeabi-v7a*.apk
      - name: Upload XMSF Normal Debug APK (x86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-x86
          path: app/build/outputs/apk/normal/debug/**/*x86_*.apk
      - name: Upload XMSF Normal Debug APK (x86_64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-x86_64
          path: app/build/outputs/apk/normal/debug/**/*x86_64*.apk
      - name: Upload XMSF Normal Debug APK (universal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-universal
          path: app/build/outputs/apk/normal/debug/**/*universal*.apk
      - name: Upload XMSF vc105 Debug APK (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-armeabi-v7a
          path: app/build/outputs/apk/vc105/debug/**/*armeabi-v7a*.apk
      - name: Upload XMSF vc105 Debug APK (x86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-x86
          path: app/build/outputs/apk/vc105/debug/**/*x86_*.apk
      - name: Upload XMSF vc105 Debug APK (x86_64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-x86_64
          path: app/build/outputs/apk/vc105/debug/**/*x86_64*.apk
      - name: Upload XMSF vc105 Debug APK (universal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-universal
          path: app/build/outputs/apk/vc105/debug/**/*universal*.apk
      - name: Upload MiPush Debug APK (arm64-v8a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-arm64-v8a
          path: mipush/build/outputs/apk/debug/**/*arm64-v8a*.apk
      - name: Upload MiPush Debug APK (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-armeabi-v7a
          path: mipush/build/outputs/apk/debug/**/*armeabi-v7a*.apk
      - name: Upload MiPush Debug APK (x86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-x86
          path: mipush/build/outputs/apk/debug/**/*x86_*.apk
      - name: Upload MiPush Debug APK (x86_64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-x86_64
          path: mipush/build/outputs/apk/debug/**/*x86_64*.apk
      - name: Upload MiPush Debug APK (universal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-universal
          path: mipush/build/outputs/apk/debug/**/*universal*.apk

      - name: Upload Magisk Module
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-Magisk-Module
          path: build/output/MiPushFramework-Magisk-*.zip

  build-zygisk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MiPushZygisk
        uses: actions/checkout@v7
        with:
          repository: magisk317/MiPushZygisk
          path: MiPushZygisk
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Build Zygisk module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd MiPushZygisk
          ./build.sh

      - name: Upload Zygisk artifact (arm64-v8a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-arm64-v8a
          path: MiPushZygisk/build/arm64-v8a_*.zip

      - name: Upload Zygisk artifact (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-armeabi-v7a
          path: MiPushZygisk/build/armeabi-v7a_*.zip

      - name: Upload Zygisk artifact (x86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-x86
          path: MiPushZygisk/build/x86_*.zip

      - name: Upload Zygisk artifact (x86_64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-x86_64
          path: MiPushZygisk/build/x86_64_*.zip

      - name: Upload Zygisk artifact (universal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-universal
          path: MiPushZygisk/build/universal_*.zip

  create-release:
    name: Create Release (Debug)
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    needs: [build, build-zygisk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: artifacts/downloads
          merge-multiple: false

      - name: List downloaded artifacts (debug)
        run: |
          echo "Contents of artifacts/downloads:"
          find artifacts/downloads -type f | sort

      - name: Collect release assets by priority (modules > v8a APK > other APK)
        run: |
          mkdir -p artifacts/release
          # 1) 所有 .zip 模块（Magisk + Zygisk）优先
          find artifacts/downloads -type f -name '*.zip' -exec cp {} artifacts/release/ \;
          # 2) arm64-v8a APK
          find artifacts/downloads -type f -name '*arm64-v8a*.apk' -exec cp {} artifacts/release/ \;
          # 3) 其他 ABI APK
          find artifacts/downloads -type f -name '*.apk' ! -name '*arm64-v8a*' -exec cp {} artifacts/release/ \;
          echo "=== Release assets (copied to artifacts/release) ==="
          ls -la artifacts/release/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          tag_name="debug-$(date +%Y%m%d-%H%M%S)"
          release_name="CI Debug Build $(date +%Y-%m-%d)"

          # 使用 heredoc 安全地定义多行 release_notes，避免 Shell 解析 '>' 等特殊字符
          release_notes=$(cat <<'EOF'
          ## CI Debug Build

          Automatic debug build from `${GITHUB_REF_NAME}` branch.

          ### Assets (Priority Order)
          1. **Magisk & Zygisk modules** (`.zip`)
          2. **arm64-v8a APKs** (XMSF & MiPush)
          3. **Other ABI APKs** (armeabi-v7a, x86, x86_64, universal)

          > **Note**: These are debug builds signed with the default debug key.
          EOF
          )

          # 构建资产数组，上传顺序影响显示顺序：后传的排在最前。
          # 因此我们先添加其他 APK，再添加 v8a APK，最后添加 .zip 模块，这样 .zip 模块会排在最前面。
          assets=()
          # 1) 其他 ABI APK（最先上传，排在最后）
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find artifacts/release -type f -name '*.apk' ! -name '*arm64-v8a*' -print0 | sort -z)

          # 2) arm64-v8a APK（中间上传，排在中间）
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find artifacts/release -type f -name '*arm64-v8a*.apk' -print0 | sort -z)

          # 3) .zip 模块（最后上传，排在最前）
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find artifacts/release -type f -name '*.zip' -print0 | sort -z)

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "ERROR: no release assets collected" >&2
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            # 如果已存在，则用 upload 追加（此时上传顺序同样重要）
            gh release upload "$tag_name" "${assets[@]}" --clobber
            gh release edit "$tag_name" \
              --title "$release_name" \
              --prerelease \
              --notes "$release_notes"
          else
            gh release create "$tag_name" "${assets[@]}" \
              --title "$release_name" \
              --prerelease \
              --notes "$release_notes"
          fi