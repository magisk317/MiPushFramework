name: CI
permissions:
  contents: write
  security-events: read

on:
  pull_request:
  push:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Validate security override files
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip validation on auto-sync commits to avoid loops.
          if git log -1 --format=%s | grep -q '\[auto-sync\]'; then
            {
              echo "## CI security override note"
              echo ""
              echo "- Auto-sync commit detected, skipping validation."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Bot PRs cannot query Dependabot alerts API; just check files exist.
          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ "$HEAD_REF" == renovate/* || "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "app/dependabot" || "$PR_AUTHOR" == "github-actions[bot]" || "$PR_AUTHOR" == "renovate[bot]" ]]; then
            test -f gradle/security-overrides.properties
            test -f gradle/security-overrides.init.gradle
            {
              echo "## CI security override note"
              echo ""
              echo "- Bot or renovate PR detected (${PR_AUTHOR:-unknown}, ${HEAD_REF:-unknown})"
              echo "- Skipped remote Dependabot alerts sync check in CI"
              echo "- Verified security override files exist"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          chmod +x scripts/sync_security_overrides.sh

          # If check passes, we're done.
          if scripts/sync_security_overrides.sh --check; then
            exit 0
          fi

          # Overrides are stale — sync, commit, and push to trigger a fresh CI run.
          echo "::group::Auto-sync security overrides"
          scripts/sync_security_overrides.sh
          echo "::endgroup::"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/security-overrides.properties gradle/security-overrides.init.gradle
          git commit -m "chore(security): auto-sync dependency security overrides [auto-sync]"
          git push

          {
            echo "## CI security override note"
            echo ""
            echo "- **Security overrides were stale — auto-synced and pushed.**"
            echo "- A fresh CI run will be triggered automatically."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Security overrides auto-synced. A new CI run will pick up the fix."
          exit 1
      - name: Build & Test
        shell: bash
        run: |
          set -euo pipefail

          gradle_cmd=(
            bash scripts/with_workspace_gradle_lock.sh
            -I gradle/security-overrides.init.gradle
            --warning-mode all
            :checkReadmeBuildRequirements
            :common:check
            :xmsf:assembleDebug
            :mipush:assembleDebug
            testDebugUnitTest
            -PbuildSplits
            -Pkotlin.incremental=false
          )

          build_log="$(mktemp)"

          echo "::group::Primary build (no alias workaround)"
          if "${gradle_cmd[@]}" 2>&1 | tee "$build_log"; then
            echo "::endgroup::"
            echo ""
            echo "=========================================="
            echo "  RESULT: alias script NOT needed"
            echo "  Android SDK platform android-37 resolved"
            echo "  natively — no workaround applied."
            echo "=========================================="
            {
              echo "## CI alias status"
              echo ""
              echo "- **Alias script: NOT needed**"
              echo "- Primary build succeeded without the alias workaround."
              echo "- The Android SDK platform android-37 was resolved natively."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::endgroup::"

          if ! grep -Eqi 'Failed to find target with hash string.*android-37|Build properties not found for package Android SDK Platform 37|Package id platforms;android-37|Android SDK Platform 37' "$build_log"; then
            echo ""
            echo "=========================================="
            echo "  RESULT: build failed (unrelated error)"
            echo "  The failure is NOT an android-37 alias"
            echo "  issue — alias script skipped."
            echo "=========================================="
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "  RESULT: alias script IS needed"
          echo "  Primary build failed with android-37"
          echo "  platform error — applying workaround."
          echo "=========================================="
          {
            echo "## CI alias status"
            echo ""
            echo "- **Alias script: IS needed**"
            echo "- Primary build failed with an Android SDK platform alias error."
            echo "- Normalizing the SDK platform aliases and retrying."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::group::Alias workaround + retry build"
          bash scripts/ensure_android_sdk_platform_alias.sh
          if "${gradle_cmd[@]}" 2>&1 | tee -a "$build_log"; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          exit 1
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| App | File | Size |"
            echo "| --- | --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              app=$(printf '%s\n' "$apk" | awk -F/ '{print $1}')
              echo "| $app | $name | $size |"
            done < <(find xmsf/build/outputs/apk mipush/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload XMSF Debug APK (arm64-v8a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-arm64-v8a
          path: xmsf/build/outputs/apk/debug/**/*arm64-v8a*.apk
      - name: Upload XMSF Debug APK (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-armeabi-v7a
          path: xmsf/build/outputs/apk/debug/**/*armeabi-v7a*.apk
      - name: Upload XMSF Debug APK (x86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-x86
          path: xmsf/build/outputs/apk/debug/**/*x86_*.apk
      - name: Upload XMSF Debug APK (x86_64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-x86_64
          path: xmsf/build/outputs/apk/debug/**/*x86_64*.apk
      - name: Upload XMSF Debug APK (universal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-universal
          path: xmsf/build/outputs/apk/debug/**/*universal*.apk
      - name: Upload MiPush Debug APK (arm64-v8a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-arm64-v8a
          path: mipush/build/outputs/apk/debug/**/*arm64-v8a*.apk
      - name: Upload MiPush Debug APK (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-armeabi-v7a
          path: mipush/build/outputs/apk/debug/**/*armeabi-v7a*.apk
      - name: Upload MiPush Debug APK (x86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-x86
          path: mipush/build/outputs/apk/debug/**/*x86_*.apk
      - name: Upload MiPush Debug APK (x86_64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-x86_64
          path: mipush/build/outputs/apk/debug/**/*x86_64*.apk
      - name: Upload MiPush Debug APK (universal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-universal
          path: mipush/build/outputs/apk/debug/**/*universal*.apk
