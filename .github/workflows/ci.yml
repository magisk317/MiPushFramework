name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Validate security override files
        if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/sync_security_overrides.sh
          .github/scripts/sync_security_overrides.sh --check
      - name: Check zero deprecation baseline
        run: |
          chmod +x scripts/check_deprecation_zero.sh
          scripts/check_deprecation_zero.sh
      - name: Build & Test
        run: ./gradlew -I gradle/security-overrides.init.gradle --warning-mode all :checkNoLegacyNihilityImports :checkNoLegacyDialogActionButtons :common:check :condom:check :push:assembleDebug :push:testDebugUnitTest -PbuildSplits -Pkotlin.incremental=false
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find push/build/outputs/apk -type f -name "*.apk" | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APK (arm64-v8a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-arm64-v8a
          path: push/build/outputs/apk/**/*arm64-v8a*.apk
      - name: Upload Debug APK (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-armeabi-v7a
          path: push/build/outputs/apk/**/*armeabi-v7a*.apk
      - name: Upload Debug APK (x86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-x86
          path: push/build/outputs/apk/**/*-x86.apk
      - name: Upload Debug APK (x86_64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-x86_64
          path: push/build/outputs/apk/**/*-x86_64.apk
      - name: Upload Debug APK (universal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-universal
          path: push/build/outputs/apk/**/*universal*.apk
