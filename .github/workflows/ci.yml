name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Validate security override files
        if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync_security_overrides.sh
          scripts/sync_security_overrides.sh --check
      - name: Check zero deprecation baseline
        run: |
          chmod +x scripts/check_deprecation_zero.sh
          scripts/check_deprecation_zero.sh
      - name: Build & Test
        run: bash scripts/with_workspace_gradle_lock.sh -I gradle/security-overrides.init.gradle --warning-mode all :checkNoLegacyNihilityImports :checkNoLegacyDialogActionButtons :common:check :condom:check :push:assembleDebug :push:testDebugUnitTest -PbuildSplits -Pkotlin.incremental=false
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find push/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-debug-apks
          path: push/build/outputs/apk/**/debug/*.apk
