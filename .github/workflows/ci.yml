name: CI
permissions:
  contents: write
  security-events: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: workflow_dispatch

jobs:
  detekt:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
        with:
          ref: af0295f4631f61a163e981d52bc863e5b8f00dde
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          # The toolkit defaults to 26, but this project targets 27 (see
          # gradle/libs.versions.toml: java / javaBytecode). Lint refuses to run on
          # a JVM older than the target, and GitLab never sees that because its
          # runner image already ships 27 -- only a GitHub-hosted runner does.
          java-version: '27'
      - name: Detekt
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: --warning-mode all qualityGateDetekt -PminifyDebug -Pkotlin.incremental=false

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Guarded rather than gated, and for a narrower reason than when this was written.
    # The zero-output stall that earned the flag was a product bug, not a CI mystery: the
    # shared kit's DiagnosticShell.runSuCommand drained `su` stdout before it applied its
    # own timeout and never closed the child's stdin, so on a host where su falls back to
    # an interactive password prompt -- GitHub-hosted runners run as uid 1001 and ship
    # /usr/bin/su, while GitLab's containers and the Debian build host are root --
    # :magisk-xposed-kit:diagnostics:testDebugUnitTest hung forever and the Gradle client
    # waited on a build result that could never be sent. Fixed in magisk-xposed-kit
    # 6233ee8; with that kit commit the identical shard finishes green on ubuntu-26.04 in
    # 18m49s (run 369).
    #
    # The flag stays until the submodule pointer below moves to the fix, because until
    # then this job reproduces the hang by design. And the budget stays in-shell rather
    # than as timeout-minutes: a runner-side timeout reports the job as cancelled, which
    # continue-on-error does not absorb -- the whole run goes red (verified on run 363) --
    # while `timeout` exits 124, an ordinary step failure the flag can swallow.
    continue-on-error: true
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
        with:
          ref: af0295f4631f61a163e981d52bc863e5b8f00dde
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          # The toolkit defaults to 26, but this project targets 27 (see
          # gradle/libs.versions.toml: java / javaBytecode). Lint refuses to run on
          # a JVM older than the target, and GitLab never sees that because its
          # runner image already ships 27 -- only a GitHub-hosted runner does.
          java-version: '27'
      - name: Decode keystore for the signing plugin
        run: |
          set -euo pipefail
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
          echo "keystore_bytes=$(wc -c < release.jks)"
      - name: Test
        shell: bash
        # Pin the same named shard GitLab's android:test:pure-modules runs, so both hosts
        # execute the same work and their timings stay comparable.
        env:
          MAGISK_ANDROID_TEST_SHARDS: android-pure-modules
          # GitLab's runner forces org.gradle.daemon=false in pre_build_script (a warm daemon
          # squatting RAM caused exit-137 pipelines on 2026-10-21). This does NOT remove the
          # daemon on either host: the project's org.gradle.jvmargs need more heap than the
          # launcher JVM has, so Gradle still forks a single-use daemon per invocation
          # ("a single-use Daemon process will be forked"). Kept purely for parity -- it was
          # tried as the stall fix on 2026-10-24 and changed nothing.
          MAGISK_GRADLE_ARGS: --warning-mode all -Dorg.gradle.daemon=false
          # The same four names GitLab injects into every job as group variables, for
          # environment parity only. The shard does not need them: magisk.app.signing
          # throws at apply time solely when the task list contains a packaging task
          # (SigningTaskPolicy.requiresReleaseSigning), and android-pure-modules requests
          # test tasks exclusively. The "Failed to apply plugin 'magisk.app.signing'"
          # lines that read like shard failures in runs 363-365 are :build-logic:test's
          # own TestKit negative assertions (AndroidApplicationPluginFunctionalTest,
          # '/tmp/junit-*/build.gradle' line 3) and appear twice per invocation because
          # run_gradle_with_retry.sh cats its log file after the build returns.
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/ci/tests/test_run_test_shards.sh
          # Guards the after_script staging path, same as GitLab's
          # android:test:pure-modules: a lost allocated versionCode used to vanish
          # silently instead of failing the job.
          bash scripts/ci/tests/test_stage_ci_dist.sh
          : "${MAGISK_ANDROID_TEST_SHARDS:?MAGISK_ANDROID_TEST_SHARDS is required}"
          # A step-level timeout, not just timeout-minutes: when the runner kills a job
          # for exceeding timeout-minutes the job is reported as *cancelled*, and
          # continue-on-error does not absorb cancellation -- the whole run goes red
          # (verified on run 363). `timeout` exits 124 instead, which is an ordinary
          # step failure the allow-failure flag can swallow.
          rc=0
          timeout --kill-after=60s 25m bash scripts/ci/run_test_shards.sh "$MAGISK_ANDROID_TEST_SHARDS" || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::warning::test shard exceeded its 25m budget (exit $rc). If the kit pointer still predates magisk-xposed-kit 6233ee8, this is the su stdin stall, not a new fault. Failing the step, not the run."
            exit "$rc"
          fi
          exit "$rc"

  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    # Mirrors GitLab's android:test: one Gradle invocation of the Kover gate with the
    # detekt/module-boundary exclusions, because this job is the coverage decision and
    # must not re-run the gates that already have jobs of their own. GitLab publishes the
    # JUnit XML as a test report; the runner has no report surface, so the XMLs are kept
    # as an artifact instead (when: always, the same as GitLab's artifacts policy).
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
        with:
          ref: af0295f4631f61a163e981d52bc863e5b8f00dde
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          # See the detekt job: the project targets Java 27, the toolkit defaults to 26,
          # and only a GitHub-hosted runner notices.
          java-version: '27'
      - name: Derive the GitLab-equivalent ref slug
        id: slug
        shell: bash
        # CI_COMMIT_REF_SLUG on GitLab: lowercased, non [a-z0-9-] collapsed to single
        # hyphens, no leading/trailing hyphen, at most 80 characters. GitHub exposes only
        # the raw ref name, and actions/upload-artifact refuses a name containing '/'.
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^[-]+//; s/[-]+$//')"
          slug="${slug:0:80}"
          echo "ref_slug=$slug" >> "$GITHUB_OUTPUT"
          echo "artifact slug=$slug"
      - name: Kover coverage gate
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: --warning-mode all qualityGateKoverVerify -PminifyDebug -Pkotlin.incremental=false -x detekt -x qualityGateDetekt -x verifyModuleBoundaries
      - name: Upload JUnit and Kover reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiPushFramework-test-merged-${{ steps.slug.outputs.ref_slug }}
          path: |
            **/build/test-results/test*/TEST-*.xml
            **/build/reports/kover/**
          if-no-files-found: ignore
          retention-days: 14
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
      MAGISK_BUILD_TYPE: debug
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set debug build timestamp
        run: echo "MAGISK_BUILD_TIMESTAMP=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/resolve-ci-toolkit
        with:
          ref: af0295f4631f61a163e981d52bc863e5b8f00dde
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          # The toolkit defaults to 26, but this project targets 27 (see
          # gradle/libs.versions.toml: java / javaBytecode). Lint refuses to run on
          # a JVM older than the target, and GitLab never sees that because its
          # runner image already ships 27 -- only a GitHub-hosted runner does.
          java-version: '27'
      - name: Require release signing
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "::error::Release signing is unavailable (RELEASE_KEYSTORE / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). Every build and upload step below is gated on it, so without this the job would report success while producing no artifact at all."
          exit 1
      - name: Decode Keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
      - name: Build
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: --warning-mode all :xmsf:assembleDebug :mipush:assembleGithubDebug -PbuildSplits -PminifyDebug -Pkotlin.incremental=false
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Write build summary
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| App | File | Size |"
            echo "| --- | --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              app=$(printf '%s\n' "$apk" | awk -F/ '{print $1}')
              echo "| $app | $name | $size |"
            done < <(find xmsf/build/outputs/apk mipush/build/outputs/apk -path '*/debug/*.apk' -not -path '*/androidTest/*' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload XMSF Normal Debug APK (arm64-v8a)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-arm64-v8a
          path: xmsf/build/outputs/apk/normal/debug/**/*arm64-v8a*.apk
      - name: Upload XMSF vc105 Debug APK (arm64-v8a)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-arm64-v8a
          path: xmsf/build/outputs/apk/vc105/debug/**/*arm64-v8a*.apk
      - name: Upload XMSF Normal Debug APK (armeabi-v7a)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-armeabi-v7a
          path: xmsf/build/outputs/apk/normal/debug/**/*armeabi-v7a*.apk
      - name: Upload XMSF Normal Debug APK (x86)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-x86
          path: xmsf/build/outputs/apk/normal/debug/**/*x86_[!6]*.apk
      - name: Upload XMSF Normal Debug APK (x86_64)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-x86_64
          path: xmsf/build/outputs/apk/normal/debug/**/*x86_64*.apk
      - name: Upload XMSF Normal Debug APK (universal)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-normal-debug-universal
          path: xmsf/build/outputs/apk/normal/debug/**/*universal*.apk
      - name: Upload XMSF vc105 Debug APK (armeabi-v7a)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-armeabi-v7a
          path: xmsf/build/outputs/apk/vc105/debug/**/*armeabi-v7a*.apk
      - name: Upload XMSF vc105 Debug APK (x86)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-x86
          path: xmsf/build/outputs/apk/vc105/debug/**/*x86_[!6]*.apk
      - name: Upload XMSF vc105 Debug APK (x86_64)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-x86_64
          path: xmsf/build/outputs/apk/vc105/debug/**/*x86_64*.apk
      - name: Upload XMSF vc105 Debug APK (universal)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-vc105-debug-universal
          path: xmsf/build/outputs/apk/vc105/debug/**/*universal*.apk
      - name: Upload MiPush Debug APK (arm64-v8a)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-arm64-v8a
          path: mipush/build/outputs/apk/github/debug/**/*arm64-v8a*.apk
      - name: Upload MiPush Debug APK (armeabi-v7a)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-armeabi-v7a
          path: mipush/build/outputs/apk/github/debug/**/*armeabi-v7a*.apk
      - name: Upload MiPush Debug APK (x86)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-x86
          path: mipush/build/outputs/apk/github/debug/**/*x86_[!6]*.apk
      - name: Upload MiPush Debug APK (x86_64)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-x86_64
          path: mipush/build/outputs/apk/github/debug/**/*x86_64*.apk
      - name: Upload MiPush Debug APK (universal)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MiPush-debug-universal
          path: mipush/build/outputs/apk/github/debug/**/*universal*.apk

  build-zygisk:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      MAGISK_BUILD_TYPE: debug
      MIPUSH_ZYGISK_REF: 61a6e5a6e078c3e7c4540b8af3d03c2bed510495
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - name: Checkout MiPushFramework
        uses: actions/checkout@v7
        with:
          path: MiPushFramework
          fetch-depth: 0
      - name: Set debug build timestamp
        run: echo "MAGISK_BUILD_TIMESTAMP=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Checkout MiPushZygisk
        run: |
          git init MiPushZygisk
          git -C MiPushZygisk remote add origin https://gitlab.com/magisk3171/MiPushZygisk.git
          git -C MiPushZygisk fetch --depth 1 origin "$MIPUSH_ZYGISK_REF"
          git -C MiPushZygisk checkout --detach FETCH_HEAD

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30-beta3

      - name: Build Zygisk module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source MiPushFramework/scripts/resolve_zygisk_version_env.sh
          cd MiPushZygisk
          ./build.sh

      - name: Upload Zygisk artifact (arm64-v8a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-arm64-v8a
          path: MiPushZygisk/build/arm64-v8a_*.zip

      - name: Upload Zygisk artifact (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-armeabi-v7a
          path: MiPushZygisk/build/armeabi-v7a_*.zip

      - name: Upload Zygisk artifact (x86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-x86
          path: MiPushZygisk/build/x86_*.zip

      - name: Upload Zygisk artifact (x86_64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-x86_64
          path: MiPushZygisk/build/x86_64_*.zip

      - name: Upload Zygisk artifact (universal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-universal
          path: MiPushZygisk/build/universal_*.zip

  # --- gates mirrored from .gitlab-ci.yml --------------------------------------
  # security:gitleaks: same image, same flags. No submodule checkout here because
  # the scan covers this repository's own tree and history, and GitLab clones with
  # GIT_DEPTH: "0" -- hence fetch-depth: 0 so both sides see the same history.
  gitleaks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: gitleaks detect --source . --redact --no-banner

  # android:module-boundaries: one script, ripgrep with a grep fallback, no Gradle.
  module-boundaries:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify module boundaries
        run: bash scripts/checks/verify_module_boundaries.sh

  # android:shared-compat: compile-only consumer compatibility check through the
  # same pinned toolkit the GitLab job resolves.
  shared-compat:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
        with:
          ref: af0295f4631f61a163e981d52bc863e5b8f00dde
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          # The toolkit defaults to 26, but this project targets 27 (see
          # gradle/libs.versions.toml: java / javaBytecode). Lint refuses to run on
          # a JVM older than the target, and GitLab never sees that because its
          # runner image already ships 27 -- only a GitHub-hosted runner does.
          java-version: '27'
      - name: Verify shared compat
        run: |
          set -euo pipefail
          toolkit_dir="${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}"
          bash "$toolkit_dir/gradle/verify_consumer_compat.sh" \
            --root "$PWD" \
            --config "$PWD/scripts/config/compat-check.json" \
            --toolkit "$toolkit_dir"
