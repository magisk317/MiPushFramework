name: Telegram Notification

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Send Notification
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}

        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "TG_BOT_TOKEN not set, skip."
            exit 0
          fi
          THREAD_PARAM_MSG=""
          THREAD_PARAM_DOC=""
          if [ -n "$TG_THREAD_ID" ]; then
            THREAD_PARAM_MSG="-d message_thread_id=$TG_THREAD_ID"
            THREAD_PARAM_DOC="-F message_thread_id=$TG_THREAD_ID"
          fi

          RELEASE_LINK="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          CAPTION=$(printf '<b>📦 MiPushFramework Release: %s</b>\n\nRelease notes: %s' "$RELEASE_TAG" "$RELEASE_LINK")

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            $THREAD_PARAM_MSG \
            --data-urlencode "text=${CAPTION}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
