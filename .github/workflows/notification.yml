name: Telegram Notification

on:
  release:
    types: [published]
  workflow_run:
    types: [completed]
    workflows: [CI]
  workflow_dispatch:

jobs:
  notification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Send Notification
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_CI_THREAD_ID: ${{ secrets.TG_CI_THREAD_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WF_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_RUN_NAME: ${{ github.event.workflow_run.name }}
          WF_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_RUN_REPO: ${{ github.repository }}
          WF_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_COMMIT_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail

          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "TG_BOT_TOKEN not set, skip."
            exit 0
          fi

          THREAD_PARAM_MSG=""
          if [ -n "$TG_THREAD_ID" ]; then
            THREAD_PARAM_MSG="-d message_thread_id=$TG_THREAD_ID"
          fi

          # CI workflow run notification
          if [ -n "$WF_RUN_ID" ]; then
            # Only send for dev branch success
            if [ "$WF_RUN_BRANCH" != "dev" ]; then
              exit 0
            fi
            if [ "$WF_RUN_CONCLUSION" != "success" ]; then
              exit 0
            fi
            CI_MSG=$(printf '✅ workflow %s\n\n📋 %s\n🔗 Run: %s' \
              "$WF_RUN_NAME" "$CI_COMMIT_TITLE" "$WF_RUN_URL")
            CI_THREAD_PARAM=""
            if [ -n "$TG_CI_THREAD_ID" ]; then
              CI_THREAD_PARAM="-d message_thread_id=$TG_CI_THREAD_ID"
            fi
            curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              $CI_THREAD_PARAM \
              --data-urlencode "text=${CI_MSG}" \
              -d "disable_web_page_preview=true"
            exit 0
          fi

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(git tag --points-at HEAD | sort -V | tail -n 1)"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME:-manual}"
          fi

          if [ -f "docs/CHANGELOG.md" ]; then
            RELEASE_CONTENT="$(awk -v tag="$RELEASE_TAG" '
              index($0, "## [" tag "]") == 1 {capture=1; next}
              capture && /^## \[/ {exit}
              capture {print}
            ' docs/CHANGELOG.md)"
          else
            RELEASE_CONTENT=""
          fi

          if [ -z "$RELEASE_CONTENT" ]; then
            RELEASE_CONTENT="Release notes unavailable. See: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          fi

          CAPTION=$(printf '📦 MiPushFramework Release: %s\n\n%s' "$RELEASE_TAG" "$RELEASE_CONTENT")

          response="$(
            curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              $THREAD_PARAM_MSG \
              --data-urlencode "text=${CAPTION}" \
              -d "disable_web_page_preview=true"
          )"
          echo "$response"
