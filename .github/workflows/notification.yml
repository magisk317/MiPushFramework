name: Telegram Notification

on:
  release:
    types: [published]
  workflow_run:
    types: [completed]
    workflows: [CI]
  workflow_dispatch:

jobs:
  notification:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download artifacts
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts
          github-token: ${{ github.token }}

      - name: Send Notification
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_CI_THREAD_ID: ${{ secrets.TG_CI_THREAD_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WF_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_RUN_NAME: ${{ github.event.workflow_run.name }}
          WF_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_RUN_REPO: ${{ github.repository }}
          WF_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_COMMIT_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_TOKEN:-}" ]; then
            echo "TG_BOT_TOKEN not set, skip."
            exit 0
          fi

          TG_MAX_FILESIZE=$((50 * 1024 * 1024))
          PROJECT_TAG="📌 #MiPushFramework"

          send_message() {
            local thread=$1
            local text=$2
            local curl_args=(
              --fail-with-body
              -sS
              -X POST
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage"
              -d "chat_id=${TG_CHAT_ID}"
              --data-urlencode "text=${text}"
              -d "disable_web_page_preview=true"
            )
            if [ -n "$thread" ]; then
              curl_args+=(-d "message_thread_id=$thread")
            fi
            curl "${curl_args[@]}"
          }

          send_document() {
            local file=$1
            local thread=$2
            local caption=$3
            local size
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            local name
            name=$(basename "$file")

            if [ "$size" -gt "$TG_MAX_FILESIZE" ]; then
              echo "$name is $((size / 1024 / 1024))MB, exceeds 50MB limit; sending download link instead."
              local link
              if [ -n "${WF_RUN_ID:-}" ]; then
                link="https://github.com/${WF_RUN_REPO}/actions/runs/${WF_RUN_ID}"
              elif [ -n "${RELEASE_TAG:-}" ]; then
                link="https://github.com/${WF_RUN_REPO}/releases/tag/${RELEASE_TAG}"
              else
                link="https://github.com/${WF_RUN_REPO}/releases"
              fi
              local msg
              msg=$(printf '📦 %s (%sMB) exceeds Telegram upload limit.\n%s\n🔗 Download: %s' \
                "$name" "$((size / 1024 / 1024))" "$PROJECT_TAG" "$link")
              send_message "$thread" "$msg"
              return 0
            fi

            echo "Sending $file to Telegram..."
            local curl_args=(
              --fail-with-body
              -sS
              -X POST
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
              -F "chat_id=${TG_CHAT_ID}"
              -F "document=@${file}"
            )
            if [ -n "$thread" ]; then
              curl_args+=(-F "message_thread_id=$thread")
            fi
            if [ -n "$caption" ]; then
              curl_args+=(-F "caption=$caption")
            fi
            curl "${curl_args[@]}"
          }

          # CI workflow-run notification
          if [ -n "${WF_RUN_ID:-}" ]; then
            if [ "${WF_RUN_CONCLUSION:-}" != "success" ]; then
              exit 0
            fi

            if [ "${WF_RUN_NAME:-}" != "CI" ] || [ "${WF_RUN_BRANCH:-}" != "dev" ]; then
              exit 0
            fi

            # Skip CI notification if commit is tagged (Release workflow handles it)
            if [ -n "${WF_RUN_SHA:-}" ] && git tag --points-at "$WF_RUN_SHA" 2>/dev/null | grep -q .; then
              echo "Commit $WF_RUN_SHA has tags, skipping CI notification (Release will notify)."
              exit 0
            fi

            CI_MSG=$(printf '✅ MiPushFramework：%s\n%s\n📋 %s\n🔗 Run: %s' \
              "${WF_RUN_NAME:-CI}" "$PROJECT_TAG" "${CI_COMMIT_TITLE:-}" "${WF_RUN_URL:-}")
            
            CI_THREAD=""
            if [ -n "${TG_CI_THREAD_ID:-}" ]; then CI_THREAD="$TG_CI_THREAD_ID"; fi

            send_message "$CI_THREAD" "$CI_MSG"

            # Upload arm64-v8a artifacts only for both xmsf and mipush
            if [ -d "artifacts" ]; then
              find artifacts -type f \( -name "*xmsf*arm64-v8a*.apk" -o -name "*MiPush*arm64-v8a*.apk" -o -name "*vc105*arm64-v8a*.apk" -o -name "*arm64-v8a*.apk" \) | sort -u | while read -r apk; do
                apk_caption=$(printf '📦 %s\n%s' "$(basename "$apk")" "$PROJECT_TAG")
                send_document "$apk" "$CI_THREAD" "$apk_caption"
              done
            fi
            exit 0
          fi

          # Release notification
          if [ -z "${RELEASE_TAG:-}" ]; then
            RELEASE_TAG="$(git tag --points-at HEAD | sort -V | tail -n 1)"
          fi
          if [ -z "${RELEASE_TAG:-}" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME:-manual}"
          fi

          if [ -f "docs/CHANGELOG.md" ]; then
            RELEASE_CONTENT="$(awk -v tag="$RELEASE_TAG" '
              index($0, "## [" tag "]") == 1 {capture=1; next}
              capture && /^## \[/ {exit}
              capture {print}
            ' docs/CHANGELOG.md)"
          else
            RELEASE_CONTENT=""
          fi

          if [ -z "$RELEASE_CONTENT" ]; then
            RELEASE_CONTENT="Release notes unavailable. See: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          fi

          CAPTION=$(printf '📦 MiPushFramework：Release %s\n%s\n\n%s' "$RELEASE_TAG" "$PROJECT_TAG" "$RELEASE_CONTENT")
          
          RELEASE_THREAD=""
          if [ -n "${TG_THREAD_ID:-}" ]; then RELEASE_THREAD="$TG_THREAD_ID"; fi

          send_message "$RELEASE_THREAD" "$CAPTION"

          # Download and upload arm64-v8a assets only for both xmsf and mipush
          if [ "${ASSETS_JSON:-null}" != "null" ]; then
            mkdir -p downloads
            echo "$ASSETS_JSON" | jq -c '.[]' | while read -r asset; do
              name=$(echo "$asset" | jq -r '.name')
              url=$(echo "$asset" | jq -r '.browser_download_url')
              if [[ "$name" == *arm64-v8a*.apk ]] && [[ "$name" == *MiPushFramework* || "$name" == *MiPush* || "$name" == *xmsf* ]]; then
                echo "Downloading $name..."
                curl --fail-with-body -L -sS -o "downloads/$name" "$url"
                asset_caption=$(printf '📦 %s\n%s' "$name" "$PROJECT_TAG")
                send_document "downloads/$name" "$RELEASE_THREAD" "$asset_caption"
              fi
            done
          fi
