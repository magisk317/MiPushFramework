name: Telegram Notification

permissions:
  actions: read
  contents: read

on:
  workflow_run:
    types: [completed]
    workflows: [CI, Release]
  workflow_dispatch:

jobs:
  notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve CI toolkit
        run: bash scripts/resolve_ci_toolkit.sh

      - name: Prepare GitHub release notes
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Release' && startsWith(github.event.workflow_run.head_branch, 'v')
        env:
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch }}
          MAGISK_RELEASE_NOTES_FILE: release-notes-github.md
          MAGISK_RELEASE_PLATFORM: github
        run: scripts/publish_mipush_release.sh release-notes

      - name: Download artifacts
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'beta'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts
          github-token: ${{ github.token }}

      - name: Send Notification
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_CI_THREAD_ID: ${{ secrets.TG_CI_THREAD_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WF_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_RUN_NAME: ${{ github.event.workflow_run.name }}
          WF_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_RUN_REPO: ${{ github.repository }}
          WF_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_COMMIT_TITLE: ${{ github.event.workflow_run.display_title }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_TAG: '📌 #MiPushFramework'
          CI_BRANCH: 'beta'
          RELEASE_NOTES_SOURCE: 'release-notes-github.md'
        run: bash .magisk-ci-toolkit/github/send_telegram_notification.sh
