name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

  build-xmsf-apk:
    name: Build XMSF Release APK
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build XMSF release APK
        run: bash scripts/build_release.sh -Pkotlin.incremental=false
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload XMSF release artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-xmsf
          path: app/build/outputs/apk/normal/release/**/*arm64-v8a*.apk

  build-mipush-apk:
    name: Build MiPush Release APK
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build MiPush release APK
        run: ./gradlew :mipush:assembleRelease -PbuildSplits=true -Pkotlin.incremental=false
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload MiPush release artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-mipush
          path: mipush/build/outputs/apk/release/**/*.apk

  build-zygisk:
    name: Build Zygisk Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MiPushZygisk
        uses: actions/checkout@v7
        with:
          repository: magisk317/MiPushZygisk
          path: MiPushZygisk
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Build Zygisk module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd MiPushZygisk
          ./build.sh

      - name: Upload Zygisk artifact (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-arm64-v8a
          path: MiPushZygisk/build/arm64-v8a_*.zip

      - name: Upload Zygisk artifact (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-armeabi-v7a
          path: MiPushZygisk/build/armeabi-v7a_*.zip

      - name: Upload Zygisk artifact (x86)
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-x86
          path: MiPushZygisk/build/x86_*.zip

      - name: Upload Zygisk artifact (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-x86_64
          path: MiPushZygisk/build/x86_64_*.zip

      - name: Upload Zygisk artifact (universal)
        uses: actions/upload-artifact@v7
        with:
          name: mipush-zygisk-universal
          path: MiPushZygisk/build/universal_*.zip

  build-magisk-module:
    name: Build Magisk Module
    needs: [build-xmsf-apk, build-mipush-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download XMSF Artifact
        uses: actions/download-artifact@v8
        with:
          name: apks-xmsf
          path: artifacts/xmsf

      - name: Download MiPush Artifact
        uses: actions/download-artifact@v8
        with:
          name: apks-mipush
          path: artifacts/mipush

      - name: Build Magisk Module
        run: |
          XMSF_APK="$(find artifacts/xmsf -name '*arm64-v8a*' | head -1)"
          MIPUSH_APK="$(find artifacts/mipush -name '*.apk' | head -1)"
          echo "XMSF_APK=$XMSF_APK"
          echo "MIPUSH_APK=$MIPUSH_APK"
          bash scripts/build_magisk_module.sh "$XMSF_APK" "$MIPUSH_APK"

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-magisk-module
          path: build/output/MiPushFramework-Magisk-*.zip

  create-release:
    name: Create Release
    needs: [build-xmsf-apk, build-mipush-apk, build-zygisk, build-magisk-module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: artifacts/downloads
          merge-multiple: false

      - name: Collect and Sort Release Assets
        id: collect-assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          echo "=== 1) Copying arm64-v8a APKs ==="
          find artifacts/downloads -type f -name '*arm64-v8a*.apk' -exec cp {} artifacts/release/ \;

          echo "=== 2) Copying Magisk module ==="
          find artifacts/downloads -type f -name 'MiPushFramework-Magisk-*.zip' -exec cp {} artifacts/release/ \; || true

          echo "=== 3) Copying Zygisk modules ==="
          find artifacts/downloads -type f -name '*.zip' -path '*zygisk*' -exec cp {} artifacts/release/ \; || true

          echo "=== 4) Copying Remaining APKs ==="
          find artifacts/downloads -type f -name '*.apk' ! -name '*arm64-v8a*' -exec cp {} artifacts/release/ \; || true

          echo "=== Collected Files Overview ==="
          ls -la artifacts/release/

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          # 根据触发源决定发布类型
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # ------ 调试/手动编译分支 (Debug) ------
            tag_name="debug-$(date +%Y%m%d-%H%M%S)"
            release_name="CI Debug Build $(date +%Y-%m-%d)"
            echo "## CI Debug Build" > release_notes.md
            echo "Automatic debug build from \`${GITHUB_REF_NAME}\` branch." >> release_notes.md
            echo "### Assets" >> release_notes.md
            echo "- **XMSF/MiPush** (arm64-v8a) — APKs" >> release_notes.md
            echo "- **Magisk Module** — Flash in Magisk Manager" >> release_notes.md
            echo "- **Zygisk Module** — Architecture-specific Zygisk zip modules" >> release_notes.md
            echo "> **Note**: Signed with default debug key." >> release_notes.md
            is_draft="--draft"
          else
            # ------ 正式 Tag 触发发布分支 (Release) ------
            tag_name="${GITHUB_REF_NAME}"
            release_name="$tag_name"
            release_notes="MiPushFramework Release ${tag_name}"
            changelog_notes=""
            if [[ -f "docs/CHANGELOG.md" ]]; then
              changelog_notes="$(awk -v version="$tag_name" '
                $0 == "---" && found { exit }
                found { print; next }
                index($0, "## [" version "]") == 1 { found = 1; next }
              ' docs/CHANGELOG.md)"
              if [[ -n "$changelog_notes" ]]; then release_notes="$changelog_notes"; fi
            fi

            previous_tag="$(git describe --tags --abbrev=0 "${tag_name}^{commit}^" 2>/dev/null || true)"
            generate_args=(-X POST -f "tag_name=${tag_name}")
            if [[ -n "$previous_tag" ]]; then generate_args+=(-f "previous_tag_name=${previous_tag}"); fi
            
            generated_notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${generate_args[@]}" --jq '.body' 2>/dev/null || true)"
            if [[ -n "$generated_notes" ]]; then
              changelog_without_link="$(printf '%s\n' "$changelog_notes" | sed '/^[[:space:]]*>[[:space:]]*Full Changelog:/d')"
              if [[ -n "$changelog_without_link" ]]; then
                release_notes="$(printf '%s\n\n%s\n' "$changelog_without_link" "$generated_notes")"
              else
