name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

  build-xmsf-apk:
    name: Build XMSF Release APK
    needs: [validate-release]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build XMSF release APK
        run: bash scripts/build_release.sh -Pkotlin.incremental=false
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload XMSF release artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-xmsf
          path: app/build/outputs/apk/normal/release/**/*arm64-v8a*.apk

      - name: Package mapping files for debugging
        run: |
          mkdir -p mapping-out
          cp app/build/outputs/mapping/normalRelease/mapping.txt mapping-out/mapping-normal-release.txt 2>/dev/null || true

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v7
        with:
          name: mapping
          path: mapping-out/

  build-mipush-apk:
    name: Build MiPush Release APK
    needs: [validate-release]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build MiPush release APK
        run: ./gradlew :mipush:assembleRelease -PbuildSplits=true -Pkotlin.incremental=false
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload MiPush release artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-mipush
          path: mipush/build/outputs/apk/release/**/*.apk

  build-zygisk-module:
    name: Build Zygisk Module
    needs: [validate-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MiPushZygisk
        uses: actions/checkout@v7
        with:
          repository: 'magisk317/MiPushZygisk'
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Build Zygisk module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./build.sh

      - name: Upload Zygisk release artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-zygisk
          path: build/*.zip

  build-magisk-module:
    name: Build Magisk Module
    needs: [build-xmsf-apk, build-mipush-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download XMSF APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apks-xmsf
          path: artifacts/xmsf

      - name: Download MiPush APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apks-mipush
          path: artifacts/mipush

      - name: Build Magisk Module
        run: |
          echo "🔍 Searching for XMSF arm64-v8a APK..."
          XMSF_APK="$(find artifacts/xmsf -type f -name '*arm64-v8a*.apk' | head -n 1)"
          if [[ -n "$XMSF_APK" ]]; then
            echo "✅ XMSF arm64-v8a found: $XMSF_APK"
          else
            echo "❌ XMSF arm64-v8a not found, trying universal..."
            XMSF_APK="$(find artifacts/xmsf -type f -name '*universal*.apk' | head -n 1)"
            if [[ -n "$XMSF_APK" ]]; then
              echo "✅ XMSF universal found: $XMSF_APK"
            else
              echo "ERROR: No XMSF APK found (arm64-v8a or universal)!" >&2
              exit 1
            fi
          fi

          echo "🔍 Searching for MiPush arm64-v8a APK..."
          MIPUSH_APK="$(find artifacts/mipush -type f -name '*arm64-v8a*.apk' | head -n 1)"
          if [[ -n "$MIPUSH_APK" ]]; then
            echo "✅ MiPush arm64-v8a found: $MIPUSH_APK"
          else
            echo "❌ MiPush arm64-v8a not found, trying universal..."
            MIPUSH_APK="$(find artifacts/mipush -type f -name '*universal*.apk' | head -n 1)"
            if [[ -n "$MIPUSH_APK" ]]; then
              echo "✅ MiPush universal found: $MIPUSH_APK"
            else
              echo "ERROR: No MiPush APK found (arm64-v8a or universal)!" >&2
              exit 1
            fi
          fi

          echo "Final APK paths:"
          echo "  XMSF_APK   = $XMSF_APK"
          echo "  MIPUSH_APK = $MIPUSH_APK"
          ls -lh "$XMSF_APK" "$MIPUSH_APK"

          bash scripts/build_magisk_module.sh "$XMSF_APK" "$MIPUSH_APK"

      - name: Verify Magisk module contents
        run: |
          ZIP_FILE="$(find build/output -name 'MiPushFramework-Magisk-*.zip' | head -n 1)"
          echo "Contents of $ZIP_FILE:"
          unzip -l "$ZIP_FILE"
          if ! unzip -l "$ZIP_FILE" | grep -q "system/app/io.github.magisk317.mipush/base.apk"; then
            echo "ERROR: MiPush APK not found in module zip!" >&2
            exit 1
          fi
          if ! unzip -l "$ZIP_FILE" | grep -q "system/app/com.xiaomi.xmsf/base.apk"; then
            echo "ERROR: XMSF APK not found in module zip!" >&2
            exit 1
          fi
          echo "✅ Both APKs present in module."

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-magisk-module
          path: build/output/MiPushFramework-Magisk-*.zip

  create-release:
    name: Create Release
    needs: [build-xmsf-apk, build-mipush-apk, build-zygisk-module, build-magisk-module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          path: artifacts/apks
          merge-multiple: true

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          release_name="$tag_name"
          release_notes="MiPushFramework Release ${tag_name}"
          changelog_notes=""
          if [[ -f "docs/CHANGELOG.md" ]]; then
            changelog_notes="$(awk -v version="$tag_name" '
              $0 == "---" && found { exit }
              found { print; next }
              index($0, "## [" version "]") == 1 { found = 1; next }
            ' docs/CHANGELOG.md)"
            if [[ -n "$changelog_notes" ]]; then
              release_notes="$changelog_notes"
            fi
          fi

          previous_tag=""
          compare_range="$(printf '%s\n' "$changelog_notes" |
            sed -nE 's#.*compare/([^[:space:]]+)\.\.\.([^[:space:]]+).*#\1 \2#p' |
            head -n 1)"
          if [[ -n "$compare_range" ]]; then
            read -r previous_tag compare_to <<< "$compare_range"
            if [[ "$compare_to" != "$tag_name" ]]; then
              previous_tag=""
            fi
          fi
          if [[ -z "$previous_tag" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 "${tag_name}^{commit}^" 2>/dev/null || true)"
          fi

          generate_args=(-X POST -f "tag_name=${tag_name}")
          if [[ -n "$previous_tag" ]]; then
            generate_args+=(-f "previous_tag_name=${previous_tag}")
          fi
          generated_notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${generate_args[@]}" \
            --jq '.body' 2>/dev/null || true)"

          if [[ -n "$generated_notes" ]]; then
            changelog_without_link="$(printf '%s\n' "$changelog_notes" |
              sed '/^[[:space:]]*>[[:space:]]*Full Changelog:/d')"
            if [[ -n "$changelog_without_link" ]]; then
              release_notes="$changelog_without_link"
            else
              release_notes="$generated_notes"
            fi
          fi

          # 收集所有 APK 和 zip 作为资产
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find artifacts/apks -type f \( -name '*.apk' -o -name '*.zip' \) -print0 | sort -z)

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "ERROR: no release assets found" >&2
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${assets[@]}" --clobber
            gh release edit "$tag_name" \
              --title "$release_name" \
              --notes "$release_notes"
          else
            gh release create "$tag_name" "${assets[@]}" \
              --title "$release_name" \
              --notes "$release_notes"
          fi