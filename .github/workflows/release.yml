# GitHub fallback for the Android release axis.
#
# GitLab owns releases: .gitlab-ci.yml runs the same scripts through
# .gitlab/ci/android-release.yml, gated by the $RELEASE_OWNER group variable.
# This file exists for the one situation where that chain cannot run at all --
# the GitLab runner fleet is down -- so a release can still be cut, published to
# the GitHub Release, submitted to Play, and pushed to Xposed-Modules-Repo.
#
# The publishing itself lives in the toolkit
# (magisk317/magisk-ci-toolkit/.github/workflows/release-android.yml,
# .gitlab-ci.yml pins it at the same SHA the GitLab pipeline includes), so the
# two hosts share one implementation instead of two that drift. See
# docs/hosting-cutover.md, "GitHub fallback release chain".
#
# This file replaces the in-repo chain that duplicated those ~560 lines here.
# `name: Release` is kept: notification.yml still keys off a completed run of
# the workflow called "Release".
#
# Deploying this file does not enable publishing. GitHub publishes only while the
# repository variable RELEASE_OWNER is exactly `github`:
#   Settings -> Secrets and variables -> Actions -> Repository variables
# That equality is deliberate -- sync:github force-pushes every GitLab release
# tag here, so an unset variable would make every mirrored tag a second publish
# from the mirror's own pushes.
#
# Emergency sequence -- the full procedure, including the recovery checklist, is
# docs/github-fallback-release.md in the toolkit. Short form:
#   1. scripts/release/release_tag.sh creates the signed annotated tag locally
#      (it sources the toolkit's release/release_tag.sh; no signing key exists
#      on GitHub and none is created here).
#   2. push the branch and the tag to github only. sync:github cannot run while
#      the fleet is down, so the mirror push is manual -- and pushing the tag to
#      GitLab now would queue a tag pipeline that publishes a second time as
#      soon as a runner returns. The tag goes back during recovery.
#   3. set RELEASE_OWNER=github on this repository.
#   4. Run workflow -> Release, tag name, publish switches as required.
#      Steps 3 and 4 are the only actions that produce external side effects, so
#      rehearse first with dry_run=true and RELEASE_OWNER left as `gitlab`: a dry
#      run builds and verifies and writes nothing outside the runner. It does not
#      need a tag that exists yet, because the guard compares the tag name with
#      versionName -- so the next version is a valid rehearsal target.
#   5. When GitLab runners are back, run the toolkit's
#      release/reconcile_github_refs.sh (read-only first, then --apply) and only
#      then set RELEASE_OWNER back, or the next sync:github force-push overwrites
#      whatever this chain published.
#
# What this chain does not cover, and why that is acceptable in an outage:
#   * android:release:gitlab and xmsf:runtime:publish. Both write to the GitLab
#     side -- the GitLab Release and the generic package registry that
#     XmsfDownloader downloads from -- and neither has a GitHub equivalent to
#     write to. During an outage the registry keeps serving whatever it already
#     holds, and the GitLab Release is cut from the same tag by the same scripts
#     once the fleet returns.
#   * Telegram. The release card is reviewed by a human before it goes out
#     (notification.yml stays workflow_dispatch only), so nothing here sends it.
#   * sync:github. The mirror is exactly what is down; the operator pushes the
#     tag by hand in step 2 above.
#   * scripts/release/publish_mipush_release.sh validate-assets, the full
#     asset-set gate (10 XMSF APKs across both flavor dimensions, the mipush
#     github APKs, three mapping files, native debug symbols, 5 Zygisk ZIPs).
#     A caller cannot interleave a job inside the reusable workflow, so it can
#     only run before or after the whole chain, and after is too late to matter.
#     What runs here instead: the toolkit's APK signature validator in the build
#     job, and the Zygisk ZIP count contract in publish-zygisk-zips. Run
#     `publish_mipush_release.sh validate-assets` by hand against the downloaded
#     artifacts if a partial release is suspected.
#
# Project-specific choices below:
#   * apk_tasks builds both modules (:xmsf:assembleRelease :mipush:assembleGithubRelease)
#     and apk_roots names both output trees, mirroring
#     MAGISK_ANDROID_RELEASE_APK_ROOTS -- the signature validator refuses to run
#     when it finds no release APK, so a single-module root would fail the job.
#   * The Zygisk module ZIPs are appended by the two project-specific jobs at the
#     bottom. They live in MiPushZygisk/build, a Rust project cross-compiled with
#     its own NDK, and the toolkit's asset walker only searches the APK output
#     roots -- the same reason .gitlab-ci.yml appends them with an extra step in
#     android:release:github. The contract is identical: 5 ZIPs, or a
#     .zygisk-skip marker when the pinned source is unavailable.
#   * github_asset_pattern is *.apk because the GitHub Release carries every ABI
#     of both modules (15 APKs on a full release); the toolkit default would
#     publish only the arm64 artifact. That is also the full asset list on the
#     GitLab side -- the retired in-repo chain additionally attached mapping.txt
#     and every *.zip, which is one of the divergences this file removes. The
#     bundle and the mapping files are build inputs to the publish, not release
#     assets.
#   * initial_version_code mirrors MAGISK_PLAY_INITIAL_VERSION_CODE: the floor the
#     release version resolver starts from. It is not the current Play
#     versionCode -- that is resolved from Play at build time, and Play always
#     wins because it is the scale users are already on.
name: Release

# Manual-only by policy (2026-10-25): automatic triggers are removed so this file
# can never start on its own. Release automation is driven from the project's
# primary CI host; runs on this mirror are operator-initiated, and the inputs
# below are the only way any publishing step turns on.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Signed release tag to publish (created locally with scripts/release/release_tag.sh)'
        required: true
        type: string
      publish_github_release:
        description: 'Create or update the GitHub Release'
        type: boolean
        default: true
      publish_play:
        description: 'Submit the Play bundle to Google Play'
        type: boolean
        default: true
      publish_modules_repo:
        description: 'Publish the channel tag to Xposed-Modules-Repo'
        type: boolean
        default: true
      dry_run:
        description: 'Build and verify only; no GitHub Release, Play or Xposed-Modules-Repo side effects'
        type: boolean
        default: false

permissions:
  contents: read

# A half-finished publish must never be cancelled out from under a re-run: the
# GitHub Release would exist without the Zygisk ZIPs and the Xposed-Modules-Repo
# channel tag, and the next run would upload into that mixture.
concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  # Decides, and says out loud why. A fallback workflow that silently produced an
  # empty green run is how a release gets "published" by nobody.
  release-eligibility:
    name: Check release ownership
    runs-on: ubuntu-26.04
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      publishes: ${{ steps.gate.outputs.publishes }}
    steps:
      - id: gate
        shell: bash
        env:
          OWNER: ${{ vars.RELEASE_OWNER }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          proceed=false
          publishes=false
          mode=''
          if [[ "$OWNER" == "github" ]]; then
            proceed=true
            if [[ "$DRY_RUN" == "true" ]]; then
              mode='dry run while RELEASE_OWNER=github'
            else
              publishes=true
              mode='publishing (RELEASE_OWNER=github)'
            fi
          elif [[ "$DRY_RUN" == "true" ]]; then
            # A rehearsal writes nothing outside the runner, so it is allowed
            # while GitLab still owns the release.
            proceed=true
            mode="dry run (RELEASE_OWNER=${OWNER:-unset})"
          else
            # Only a dispatch can reach this file, so arriving here means the
            # operator dispatched a publishing run without owning the release.
            echo "::error::GitHub is not the release owner (RELEASE_OWNER=${OWNER:-unset})."
            echo "   Either set RELEASE_OWNER=github on this repository to publish from here,"
            echo "   or re-run with dry_run checked to rehearse without side effects."
            exit 1
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "publishes=$publishes" >> "$GITHUB_OUTPUT"
          {
            echo "### Release eligibility"
            echo ""
            echo "- Event: \`$EVENT\`"
            echo "- RELEASE_OWNER: \`${OWNER:-unset}\`"
            echo "- Decision: **$mode**"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release (toolkit chain)
    needs: release-eligibility
    if: needs.release-eligibility.outputs.proceed == 'true'
    permissions:
      contents: write
    uses: magisk317/magisk-ci-toolkit/.github/workflows/release-android.yml@85171f0a9dc19ae177c8ecbe5fd0c9d5b7b8bb34
    with:
      # Must equal the ref above, MAGISK_CI_TOOLKIT_REF and every GitLab
      # include.ref; ci/verify_toolkit_pin.sh in the toolkit checks it.
      toolkit_ref: 85171f0a9dc19ae177c8ecbe5fd0c9d5b7b8bb34
      release_tag: ${{ inputs.release_tag }}
      package_name: io.github.magisk317.mipush
      release_cert_sha256: 027b936e1d82a606d83599548b8b11e49a2c8ae2588c4a9fbe8311e2c54f103a
      # The same project-specific values .gitlab-ci.yml passes to the GitLab
      # release templates, under the input names that mirror those variables.
      apk_tasks: :xmsf:assembleRelease :mipush:assembleGithubRelease
      gradle_extra_args: -PbuildSplits=true -Pkotlin.incremental=false
      aab_tasks: :mipush:bundlePlayRelease
      apk_roots: xmsf/build/outputs/apk mipush/build/outputs/apk
      app_module: mipush
      play_track_override: production
      initial_version_code: '1569'
      modules_repo: Xposed-Modules-Repo/io.github.magisk317.mipush
      play_url: https://play.google.com/store/apps/details?id=io.github.magisk317.mipush
      gitlab_project_url: https://gitlab.com/magisk3171/MiPushFramework
      # github_repository is left at its default: the calling repository already
      # is magisk317/MiPushFramework, and the GitLab value exists only because
      # that pipeline runs somewhere else.
      #
      # keystore_path stays at the template default (repo-root release.jks),
      # which is what both GitLab release jobs write and export as KEYSTORE_FILE.
      github_asset_pattern: '*.apk'
      # The bundle goes to Play; it never reaches the GitHub Release on either
      # host.
      attach_aab: false
      # On a tag push every channel is on, exactly as the old chain behaved. On a
      # dispatch the operator picks; dry_run still turns all of them off inside
      # the chain.
      publish_github_release: ${{ inputs.publish_github_release }}
      publish_play: ${{ inputs.publish_play }}
      publish_modules_repo: ${{ inputs.publish_modules_repo }}
      dry_run: ${{ inputs.dry_run }}
      enabled: ${{ needs.release-eligibility.outputs.proceed == 'true' }}
      # Submodules are GitLab-hosted, so the chain needs GITLAB_TOKEN to check
      # them out; it arrives through `secrets: inherit`.
      checkout_submodules: recursive
    secrets: inherit

  # Project-specific: the Zygisk module. Runs whenever the toolkit chain runs, so
  # a rehearsal proves the Rust/NDK build still works too; only the upload is
  # gated on a real publish.
  build-zygisk-module:
    name: Build Zygisk Module
    needs: release-eligibility
    if: needs.release-eligibility.outputs.proceed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      MIPUSH_ZYGISK_REF: d4f2903fda4fcc9ccdd078599c94138e23774a2f
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"

      - name: Checkout MiPushFramework
        uses: actions/checkout@v7
        with:
          path: MiPushFramework
          fetch-depth: 0

      - name: Check Zygisk source support
        id: zygisk-source
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          git -C "$probe_dir" init -q
          git -C "$probe_dir" remote add origin https://gitlab.com/magisk3171/MiPushZygisk.git
          if git -C "$probe_dir" fetch --quiet --depth 1 origin "$MIPUSH_ZYGISK_REF" &&
            [[ "$(git -C "$probe_dir" rev-parse FETCH_HEAD)" == "$MIPUSH_ZYGISK_REF" ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "SKIP Zygisk build; source repository is unavailable on this runner."
          fi

      - name: Checkout MiPushZygisk
        if: steps.zygisk-source.outputs.supported == 'true'
        run: |
          git init MiPushZygisk
          git -C MiPushZygisk remote add origin https://gitlab.com/magisk3171/MiPushZygisk.git
          git -C MiPushZygisk fetch --depth 1 origin "$MIPUSH_ZYGISK_REF"
          git -C MiPushZygisk checkout --detach FETCH_HEAD

      - name: Install Rust toolchain
        if: steps.zygisk-source.outputs.supported == 'true'
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK
        if: steps.zygisk-source.outputs.supported == 'true'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30-beta3

      - name: Build Zygisk module
        if: steps.zygisk-source.outputs.supported == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Same switch .gitlab-ci.yml's zygisk:build:release exports on a tag
          # pipeline: a release module is built release-grade and without the
          # build timestamp. build.sh defaults to release, so stating it here is
          # about being explicit rather than relying on a default that the debug
          # CI job overrides.
          MAGISK_BUILD_TYPE: release
        run: |
          set -euo pipefail
          unset MAGISK_BUILD_TIMESTAMP
          source MiPushFramework/scripts/resolve_zygisk_version_env.sh
          cd MiPushZygisk
          ./build.sh

      # One artifact either way: the ZIPs, or the skip marker the publish job
      # looks for. An empty artifact would make the upload below fail for a
      # reason that has nothing to do with the release.
      - name: Collect Zygisk assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zygisk
          if [[ "${{ steps.zygisk-source.outputs.supported }}" == "true" ]]; then
            shopt -s nullglob
            zips=(MiPushZygisk/build/*.zip)
            shopt -u nullglob
            if [[ "${#zips[@]}" -eq 0 ]]; then
              echo "::error::Zygisk build reported success but produced no ZIP" >&2
              exit 1
            fi
            cp "${zips[@]}" zygisk/
            echo "Collected ${#zips[@]} Zygisk ZIP(s)"
          else
            printf 'source-unavailable\n' > zygisk/.zygisk-skip
            echo "Recorded skip marker; no Zygisk ZIPs this run"
          fi

      - name: Upload Zygisk artifact
        uses: actions/upload-artifact@v7
        with:
          name: zygisk-zips
          path: zygisk/*
          if-no-files-found: error

  # Appends the Zygisk ZIPs to the release the toolkit chain just published. The
  # toolkit's asset walker only searches the APK output roots, so these cannot be
  # part of its asset list -- the same split .gitlab-ci.yml makes inside
  # android:release:github.
  publish-zygisk-zips:
    name: Publish Zygisk Module ZIPs
    needs: [release-eligibility, release, build-zygisk-module]
    if: needs.release-eligibility.outputs.publishes == 'true' && needs.build-zygisk-module.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Zygisk ZIPs
        uses: actions/download-artifact@v8
        with:
          name: zygisk-zips
          path: zygisk

      - name: Append Zygisk ZIPs to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          RELEASE_TAG_NAME: ${{ needs.release.outputs.release_tag }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zygisk_zips=(zygisk/*.zip)
          shopt -u nullglob

          if [[ "${#zygisk_zips[@]}" -eq 0 ]]; then
            # zygisk:build:release signals a deliberately skipped build this way.
            if [[ -f zygisk/.zygisk-skip ]]; then
              echo "SKIP: Zygisk source unavailable; GitHub release keeps the APK set only."
              exit 0
            fi
            echo "::error::neither Zygisk ZIPs nor a skip marker were downloaded"
            exit 1
          fi
          # Keep the same contract as scripts/release/publish_mipush_release.sh so
          # the GitLab and GitHub releases never disagree on the asset set.
          if [[ -e zygisk/.zygisk-skip ]]; then
            echo "::error::Zygisk ZIPs and a skip marker were produced together"
            exit 1
          fi
          if [[ "${#zygisk_zips[@]}" -ne 5 ]]; then
            echo "::error::partial Zygisk asset set; expected 5 ZIPs, found ${#zygisk_zips[@]}"
            exit 1
          fi
          echo "Uploading ${#zygisk_zips[@]} Zygisk ZIP(s) to ${TARGET_REPO}"
          gh release upload "$RELEASE_TAG_NAME" "${zygisk_zips[@]}" \
            --repo "$TARGET_REPO" --clobber
          echo "GitHub release assets: 15 APK + ${#zygisk_zips[@]} Zygisk ZIP"
          echo "GitHub release ready: https://github.com/${TARGET_REPO}/releases/tag/${RELEASE_TAG_NAME}"
