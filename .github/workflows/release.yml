name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

  build-xmsf-apk:
    name: Build XMSF Release APK
    needs: [validate-release]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build XMSF release APK
        run: bash scripts/build_release.sh -Pkotlin.incremental=false
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload XMSF release artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-xmsf
          path: app/build/outputs/apk/normal/release/**/*arm64-v8a*.apk

      - name: Package mapping files for debugging
        run: |
          mkdir -p mapping-out
          cp app/build/outputs/mapping/normalRelease/mapping.txt mapping-out/mapping-normal-release.txt 2>/dev/null || true

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v7
        with:
          name: mapping
          path: mapping-out/

  build-mipush-apk:
    name: Build MiPush Release APK
    needs: [validate-release]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build MiPush release APK
        run: ./gradlew :mipush:assembleRelease -PbuildSplits=true -Pkotlin.incremental=false
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload MiPush release artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-mipush
          path: mipush/build/outputs/apk/release/**/*.apk

  build-zygisk-module:
    name: Build Zygisk Module
    needs: [validate-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MiPushZygisk
        uses: actions/checkout@v7
        with:
          repository: 'magisk317/MiPushZygisk'
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Build Zygisk module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./build.sh

      - name: Upload Zygisk release artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-zygisk
          path: build/*.zip

  build-magisk-module:
    name: Build Magisk Module
    needs: [build-xmsf-apk, build-mipush-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          path: artifacts/downloads
          merge-multiple: true

      - name: Build Magisk Module
        run: |
          XMSF_APK="$(find artifacts/downloads -name '*arm64-v8a*' | head -1)"
          MIPUSH_APK="$(find artifacts/downloads -name '*arm64-v8a*' | tail -1)"
          echo "XMSF_APK=$XMSF_APK"
          echo "MIPUSH_APK=$MIPUSH_APK"
          bash scripts/build_magisk_module.sh "$XMSF_APK" "$MIPUSH_APK"

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-magisk-module
          path: build/output/MiPushFramework-Magisk-*.zip



  create-release:
    name: Create Release
    needs: [build-xmsf-apk, build-mipush-apk, build-zygisk-module, build-magisk-module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          path: artifacts/apks
          merge-multiple: true

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          release_name="$tag_name"
          release_notes="MiPushFramework Release ${tag_name}"
          changelog_notes=""
          if [[ -f "docs/CHANGELOG.md" ]]; then
            changelog_notes="$(awk -v version="$tag_name" '
              $0 == "---" && found { exit }
              found { print; next }
              index($0, "## [" version "]") == 1 { found = 1; next }
            ' docs/CHANGELOG.md)"
            if [[ -n "$changelog_notes" ]]; then
              release_notes="$changelog_notes"
            fi
          fi

          previous_tag=""
          compare_range="$(printf '%s\n' "$changelog_notes" |
            sed -nE 's#.*compare/([^[:space:]]+)\.\.\.([^[:space:]]+).*#\1 \2#p' |
            head -n 1)"
          if [[ -n "$compare_range" ]]; then
            read -r previous_tag compare_to <<< "$compare_range"
            if [[ "$compare_to" != "$tag_name" ]]; then
              previous_tag=""
            fi
          fi
          if [[ -z "$previous_tag" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 "${tag_name}^{commit}^" 2>/dev/null || true)"
          fi

          generate_args=(-X POST -f "tag_name=${tag_name}")
          if [[ -n "$previous_tag" ]]; then
            generate_args+=(-f "previous_tag_name=${previous_tag}")
          fi
          generated_notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${generate_args[@]}" \
            --jq '.body' 2>/dev/null || true)"

          if [[ -n "$generated_notes" ]]; then
            changelog_without_link="$(printf '%s\n' "$changelog_notes" |
              sed '/^[[:space:]]*>[[:space:]]*Full Changelog:/d')"
            if [[ -n "$changelog_without_link" ]]; then
              release_notes="$(printf '%s\n\n%s\n' "$changelog_without_link" "$generated_notes")"
            else
              release_notes="$generated_notes"
            fi
          fi

# ── Prioritize arm64-v8a APKs, then Magisk/Zygisk modules, then other ABIs ──
                    # ���� Prioritize arm64-v8a APKs + Magisk/Zygisk modules ����
          mapfile -d '' v8a_apks < <(
            find artifacts/apks -type f -name '*arm64-v8a*' -print0 | sort -z
          )
          mapfile -d '' modules < <(
            find artifacts/apks -type f -name '*.zip' -print0 | sort -z
          )
          mapfile -d '' other_apks < <(
            find artifacts/apks -type f -name '*.apk' ! -name '*arm64-v8a*' -print0 | sort -z
          )
          # Primary: v8a APKs first, then Magisk/Zygisk modules, then other ABIs
          release_assets=("${v8a_apks[@]}" "${modules[@]}" "${other_apks[@]}")
          if [[ ${#release_assets[@]} == 0 ]]; then
            echo "ERROR: no release assets found under artifacts/apks" >&2
            find artifacts/apks -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${release_assets[@]}" --clobber
            gh release edit "$tag_name" \
              --title "$release_name" \
              --draft=false \
              --notes "$release_notes"
          else
            gh release create "$tag_name" "${release_assets[@]}" \
              --title "$release_name" \
              --verify-tag \
              --notes "$release_notes"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

  publish-to-modules-repo:
    name: Publish to Xposed-Modules-Repo
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      HAS_MODULES_REPO_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN != '' }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      MODULES_REPO: Xposed-Modules-Repo/io.github.magisk317.mipush
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          path: artifacts/apks
          merge-multiple: true

      - name: Publish Release in Xposed-Modules-Repo
        if: env.HAS_MODULES_REPO_TOKEN == 'true' && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          release_name="$tag_name"
          release_notes="MiPushFramework Release ${tag_name}"
          changelog_notes=""
          if [[ -f "docs/CHANGELOG.md" ]]; then
            changelog_notes="$(awk -v version="$tag_name" '
              $0 == "---" && found { exit }
              found { print; next }
              index($0, "## [" version "]") == 1 { found = 1; next }
            ' docs/CHANGELOG.md)"
            if [[ -n "$changelog_notes" ]]; then
              release_notes="$changelog_notes"
            fi
          fi

          previous_tag=""
          compare_range="$(printf '%s\n' "$changelog_notes" |
            sed -nE 's#.*compare/([^[:space:]]+)\.\.\.([^[:space:]]+).*#\1 \2#p' |
            head -n 1)"
          if [[ -n "$compare_range" ]]; then
            read -r previous_tag compare_to <<< "$compare_range"
            if [[ "$compare_to" != "$tag_name" ]]; then
              previous_tag=""
            fi
          fi
          if [[ -z "$previous_tag" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 "${tag_name}^{commit}^" 2>/dev/null || true)"
          fi

          generate_args=(-X POST -f "tag_name=${tag_name}")
          if [[ -n "$previous_tag" ]]; then
            generate_args+=(-f "previous_tag_name=${previous_tag}")
          fi
          generated_notes="$(GH_TOKEN="${SOURCE_RELEASE_TOKEN}" \
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${generate_args[@]}" \
            --jq '.body' 2>/dev/null || true)"

          if [[ -n "$generated_notes" ]]; then
            changelog_without_link="$(printf '%s\n' "$changelog_notes" |
              sed '/^[[:space:]]*>[[:space:]]*Full Changelog:/d')"
            if [[ -n "$changelog_without_link" ]]; then
              release_notes="$(printf '%s\n\n%s\n' "$changelog_without_link" "$generated_notes")"
            else
              release_notes="$generated_notes"
            fi
          fi

          mapfile -d '' apk_files < <(find artifacts/apks -type f -name '*.apk' -print0 | sort -z)
          if [[ ${#apk_files[@]} -eq 0 ]]; then
            echo "ERROR: no APK files found under artifacts/apks" >&2
            find artifacts/apks -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi

          if gh release view "$tag_name" --repo "${{ env.MODULES_REPO }}" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${apk_files[@]}" \
              --repo "${{ env.MODULES_REPO }}" \
              --clobber
            gh release edit "$tag_name" \
              --repo "${{ env.MODULES_REPO }}" \
              --title "$release_name" \
              --draft=false \
              --notes "$release_notes"
          else
            gh release create "$tag_name" \
              "${apk_files[@]}" \
              --repo "${{ env.MODULES_REPO }}" \
              --title "$release_name" \
              --notes "$release_notes"
          fi
        env:
          SOURCE_RELEASE_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GH_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
