name: Renovate Auto Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.base.ref == 'dev' &&
      (
        github.event.pull_request.user.login == 'renovate[bot]' ||
        (
          github.event.pull_request.user.login == 'github-actions[bot]' &&
          startsWith(github.head_ref, 'renovate/')
        ) ||
        (
          github.event.pull_request.user.login == 'magisk317' &&
          (
            startsWith(github.head_ref, 'renovate/') ||
            startsWith(github.head_ref, 'janitor/') ||
            (
              github.head_ref == 'chore/dependency-force-update' &&
              github.event.pull_request.title == 'build: update forced dependencies'
            )
          )
        )
      )
    steps:
      - name: Merge Renovate PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_URL: ${{github.event.pull_request.html_url}}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          pr_state="$(gh pr view "$PR_URL" --json state --jq '.state')"
          pr_merged_at="$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt // ""')"
          if [ "$pr_state" != "OPEN" ]; then
            echo "::notice::Renovate PR is $pr_state (mergedAt=$pr_merged_at); skipping merge."
            exit 0
          fi

          set +e
          merge_output="$(gh pr merge --merge --delete-branch "$PR_URL" 2>&1)"
          merge_status=$?
          set -e
          printf '%s\n' "$merge_output"

          if [ "$merge_status" -eq 0 ]; then
            exit 0
          fi

          if printf '%s\n' "$merge_output" | grep -Eiq 'Pull request is closed'; then
            echo "::notice::Renovate PR is no longer open; skipping merge."
            exit 0
          fi

          exit "$merge_status"
