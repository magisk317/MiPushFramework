name: Update Gradle Wrapper

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Sync Gradle Wrapper Baseline
        run: ./gradlew wrapper --gradle-version 9.5.0-milestone-7 --distribution-type bin

      - name: Verify Build
        run: ./gradlew -I gradle/security-overrides.init.gradle --warning-mode all clean :checkNoLegacyNihilityImports :checkNoLegacyDialogActionButtons :common:check :condom:check :push:assembleDebug :push:testDebugUnitTest -PbuildSplits -Pkotlin.incremental=false

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Check if there are changes to the wrapper files
          if [[ `git status --porcelain gradlew gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar` ]]; then
            VERSION=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties | sed -E 's#.*gradle-(.+)-bin\.zip#\1#')
            
            git add gradlew gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar
            git commit -m "build(wrapper): sync gradle wrapper to $VERSION"
            git push origin dev
          else
            echo "No changes to commit"
          fi
