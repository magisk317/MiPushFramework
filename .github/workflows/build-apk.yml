name: Build APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

  build-github-apk:
    name: Build GitHub APK
    needs: [validate-release]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > .yuuta.jks

      - name: Build GitHub APK
        run: bash scripts/build_release.sh -Pkotlin.incremental=false
        env:
          KEYSTORE_PASS: ${{ secrets.STORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: apks-github-arm64-v8a
          path: push/build/outputs/apk/release/**/*arm64-v8a*.apk

      - name: Upload Release APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: apks-github-armeabi-v7a
          path: push/build/outputs/apk/release/**/*armeabi-v7a*.apk

      - name: Upload Release APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: apks-github-x86
          path: push/build/outputs/apk/release/**/*_x86.apk

      - name: Upload Release APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: apks-github-x86_64
          path: push/build/outputs/apk/release/**/*_x86_64.apk

      - name: Upload Release APK (universal)
        uses: actions/upload-artifact@v7
        with:
          name: apks-github-universal
          path: push/build/outputs/apk/release/**/*universal*.apk

          mapfile -d '' release_assets < <(
            find artifacts/apks -type f -name '*.apk' -print0 | sort -z
          )
          if [[ ${#release_assets[@]} == 0 ]]; then
            echo "ERROR: no release assets found under artifacts/apks" >&2
            find artifacts/apks -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${release_assets[@]}" --clobber
            gh release edit "$tag_name" --title "$release_name" --notes "$release_notes"
          else
            gh release create "$tag_name" "${release_assets[@]}" \
              --draft \
              --title "$release_name" \
              --verify-tag \
              --generate-notes \
              --notes "$release_notes"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
