name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APKs
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > .yuuta.jks

      - name: Build APKs
        run: ./gradlew :push:assembleRelease -PbuildSplits -Pkotlin.incremental=false
        env:
          KEYSTORE_PASS: ${{ secrets.STORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: apks
          path: push/build/outputs/apk/**/*.apk

      - name: Upload Native Symbols Artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-symbols
          path: push/build/outputs/native-debug-symbols/**/*.zip
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apks
          path: artifacts/apks

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEYSTORE == 'true'
        with:
          draft: true
          files: |
            artifacts/apks/**/*.apk
          body: |
            ## MiPushFramework Release
            Automated build for version ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
