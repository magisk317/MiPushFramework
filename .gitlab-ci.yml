include:
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: 1d4e81b29086f6e037b3ed9d3f888dfce75f46f5
    file: /.gitlab/ci/android.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: 1d4e81b29086f6e037b3ed9d3f888dfce75f46f5
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: 1d4e81b29086f6e037b3ed9d3f888dfce75f46f5
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: 1d4e81b29086f6e037b3ed9d3f888dfce75f46f5
    file: /.gitlab/ci/renovate.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  # ARM runners handle Android compilation; Robolectric remains explicitly on AMD64.
  tags:
    - magisk-amd64-linux

stages:
  - build
  - package
  - release-validate
  - release-build
  - release-publish
  - notify
  - quality
  - maintenance

variables:
  MAGISK_CI_TOOLKIT_REF: "1d4e81b29086f6e037b3ed9d3f888dfce75f46f5"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.0"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "io.github.magisk317.mipush"
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "true"
  MAGISK_PLAY_INITIAL_VERSION_CODE: "1569"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/MiPushFramework"
  MIPUSH_ZYGISK_REPOSITORY: "https://gitlab.com/magisk3171/MiPushZygisk.git"
  # Pin the external source so an old tag cannot change when MiPushZygisk/main advances.
  MIPUSH_ZYGISK_REF: "b350ca6bd0467af389e2473cabc308cedd2e2317"
  MIPUSH_ZYGISK_NDK_VERSION: "r27d"
  MIPUSH_ZYGISK_NDK_HOME: "$CI_PROJECT_DIR/.android/android-ndk-r27d"
  # Public SHA-256 fingerprint of the production APK signing certificate.
  MAGISK_ANDROID_RELEASE_CERT_SHA256: "027b936e1d82a606d83599548b8b11e49a2c8ae2588c4a9fbe8311e2c54f103a"
  MAGISK_ANDROID_RELEASE_APK_ROOTS: "app/build/outputs/apk mipush/build/outputs/apk"

.mipush_android_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

.mipush_signed_android_rules:
  rules:
    - if: '$RELEASE_KEYSTORE == "" || $STORE_PASSWORD == "" || $KEY_ALIAS == "" || $KEY_PASSWORD == ""'
      when: never
    - !reference [.mipush_android_rules, rules]

.mipush_package_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
    - when: never

android:build:
  extends:
    - .magisk_android_build
    - .mipush_signed_android_rules
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  variables:
    MAGISK_BUILD_TIMESTAMP: "$CI_PIPELINE_CREATED_AT"
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:assembleDebug
      :mipush:assembleGithubDebug
      -PbuildSplits
      -PminifyDebug
      -Pkotlin.incremental=false
  # The runner provides persistent SDK/Gradle directories outside the project;
  # the inherited project-relative cache paths only produce empty-cache warnings.
  cache: []
  artifacts:
    name: "MiPushFramework-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/**/debug/*.apk
      - mipush/build/outputs/apk/**/debug/*.apk

android:check:
  extends: .magisk_android_build
  tags:
    - magisk-arm64-linux
  stage: quality
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:compileDebugKotlin
      :mipush:compileGithubDebugKotlin
      -Pkotlin.incremental=false

.mipush_zygisk_build:
  extends: .mipush_package_rules
  image: "rust:1.98.0-bookworm"
  stage: build
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    ANDROID_NDK_HOME: "$MIPUSH_ZYGISK_NDK_HOME"
  cache:
    key: "zygisk-cargo-$MIPUSH_ZYGISK_RUNNER_GROUP-$CI_COMMIT_REF_SLUG-$MIPUSH_ZYGISK_REF"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - MiPushZygisk/module/target/
  before_script:
    - |
      set -euo pipefail
      if ! command -v git >/dev/null 2>&1; then
        echo "SKIP Zygisk build; git is unavailable on this runner."
        mkdir -p MiPushZygisk/build
        printf '%s\n' "source-unavailable" > MiPushZygisk/build/.zygisk-skip
        exit 0
      fi

      set +e
      scripts/resolve_zygisk_source.sh "$CI_PROJECT_DIR/MiPushZygisk" >/dev/null
      resolve_status="$?"
      set -e
      if [[ "$resolve_status" -eq 2 ]]; then
        echo "SKIP Zygisk build; pinned source is unavailable on this runner."
        mkdir -p MiPushZygisk/build
        printf '%s\n' "source-unavailable" > MiPushZygisk/build/.zygisk-skip
        exit 0
      elif [[ "$resolve_status" -ne 0 ]]; then
        echo "ERROR: failed to resolve the pinned MiPushZygisk source" >&2
        exit "$resolve_status"
      fi

      export DEBIAN_FRONTEND=noninteractive
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [[ "$use_mirror" == "true" ]]; then
        sed -i \
          -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
          -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      fi
      if [[ "$use_mirror" == "true" ]]; then
        if ! apt-get update; then
          echo "Mirror apt-get update failed, falling back to official sources" >&2
          sed -i \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian-security#http://deb.debian.org/debian-security#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian#http://deb.debian.org/debian#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get update
        fi
      else
        apt-get update
      fi
    - apt-get install -y --no-install-recommends ca-certificates clang curl git lld unzip zip
    - |
      set -euo pipefail
      mkdir -p "$CARGO_HOME"
      cat > "$CARGO_HOME/config.toml" <<'EOF'
      [net]
      git-fetch-with-cli = true
      EOF
      if [[ "$use_mirror" == "true" ]]; then
        cat >> "$CARGO_HOME/config.toml" <<'EOF'

      [source.crates-io]
      replace-with = "tuna"

      [source.tuna]
      registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
      EOF
      fi
    - |
      set -euo pipefail
      if [[ "$use_mirror" == "true" ]]; then
        export RUSTUP_DIST_SERVER="https://mirrors.tuna.tsinghua.edu.cn/rustup"
        export RUSTUP_UPDATE_ROOT="https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup"
      else
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
      fi
      if ! rustup target add $MIPUSH_ZYGISK_RUST_TARGETS; then
        echo "Rustup mirror failed, falling back to official server" >&2
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
        rustup target add $MIPUSH_ZYGISK_RUST_TARGETS
      fi
    - mkdir -p .android
    - |
      set -euo pipefail
      if [ ! -d "$ANDROID_NDK_HOME" ]; then
        curl --retry 5 --retry-all-errors --continue-at - --fail --location --silent --show-error \
          "https://dl.google.com/android/repository/android-ndk-${MIPUSH_ZYGISK_NDK_VERSION}-linux.zip" \
          --output /tmp/android-ndk.zip
        unzip -q /tmp/android-ndk.zip -d .android
      fi
  script:
    - |
      set -euo pipefail
      if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        export MAGISK_BUILD_TYPE=release
        unset MAGISK_BUILD_TIMESTAMP
      else
        export MAGISK_BUILD_TYPE=debug
        export MAGISK_BUILD_TIMESTAMP="$CI_PIPELINE_CREATED_AT"
      fi
      source scripts/resolve_zygisk_version_env.sh
      cd MiPushZygisk
      ./build.sh
  artifacts:
    name: "MiPushFramework-zygisk-$MIPUSH_ZYGISK_RUNNER_GROUP-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - MiPushZygisk/build/*.zip
      - MiPushZygisk/magisk/zygisk/*.so
      - MiPushZygisk/build/.zygisk-skip

zygisk:build:arm:
  extends: .mipush_zygisk_build
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - !reference [.mipush_package_rules, rules]
  variables:
    MIPUSH_ZYGISK_RUNNER_GROUP: "arm"
    MIPUSH_ZYGISK_BUILD_ABIS: "arm64-v8a"
    MIPUSH_ZYGISK_RUST_TARGETS: "aarch64-linux-android"

# The ARM host cannot build the x86/x86_64 Zygisk variants. Formal releases
# need all four ABI ZIPs plus the auto-generated universal ZIP, so build them
# on AMD64 while regular CI keeps the native ARM-only artifact above.
zygisk:build:release:
  extends: .mipush_zygisk_build
  tags:
    - magisk-amd64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - when: never
  variables:
    MIPUSH_ZYGISK_RUNNER_GROUP: "release"
    MIPUSH_ZYGISK_BUILD_ABIS: "arm64-v8a armeabi-v7a x86 x86_64"
    MIPUSH_ZYGISK_RUST_TARGETS: "aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android"

telegram:ci:
  extends:
    - .magisk_telegram_ci
    - .mipush_signed_android_rules
  stage: notify
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #MiPushFramework"
    MAGISK_TELEGRAM_PROJECT_NAME: "MiPushFramework"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
    MAGISK_TELEGRAM_CI_ARTIFACT_PATTERNS: |-
      *arm64-v8a*.apk
      arm64-v8a_*.zip
  needs:
    - job: android:build
      artifacts: true
      optional: true
    - job: android:ci:play-alpha
      artifacts: false
      optional: true
    - job: zygisk:build:arm
      artifacts: true
      optional: true

android:detekt:
  extends:
    - .magisk_android_detekt
    - .mipush_android_rules
  stage: quality
  tags:
    - magisk-arm64-linux
  needs:
    - job: android:ci:play-alpha
      artifacts: false
      optional: true
  cache: []
  variables:
    MAGISK_ANDROID_DETEKT_TASKS: >-
      detekt
      qualityGateDetekt
      -PminifyDebug
      -Pkotlin.incremental=false
  artifacts:
    name: "MiPushFramework-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

android:test:pure-modules:
  extends:
    - .magisk_android_base
    - .mipush_android_rules
  image: "eclipse-temurin:26.0.1_8-jdk"
  stage: quality
  tags:
    - magisk-arm64-linux
  needs:
    - job: android:ci:play-alpha
      artifacts: false
      optional: true
  cache: []
  variables:
    MAGISK_ANDROID_TEST_SHARDS: android-pure-modules
  script:
    - |
      set -euo pipefail
      : "${MAGISK_ANDROID_TEST_SHARDS:?MAGISK_ANDROID_TEST_SHARDS is required}"
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      bash scripts/ci/run_test_shards.sh $MAGISK_ANDROID_TEST_SHARDS
  artifacts:
    name: "MiPushFramework-pure-modules-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - "**/build/test-results/test*/TEST-*.xml"

android:test:
  extends:
    - .magisk_android_base
    - .mipush_android_rules
  # Coverage gate runs on ARM after Alpha publishing.
  image: "eclipse-temurin:26.0.1_8-jdk"
  stage: quality
  tags:
    - magisk-arm64-linux
  needs:
    - job: android:test:pure-modules
      artifacts: true
    - job: android:ci:play-alpha
      artifacts: false
      optional: true
  cache: []
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      # Coverage gate — run kover and quality checks.
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
        qualityGateKoverVerify \
        -PminifyDebug \
        -Pkotlin.incremental=false \
        -x detekt \
        -x qualityGateDetekt \
        -x verifyModuleBoundaries
  artifacts:
    name: "MiPushFramework-test-merged-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - "**/build/test-results/test*/TEST-*.xml"

android:module-boundaries:
  extends:
    - .magisk_linux_base
    - .mipush_android_rules
  stage: quality
  tags:
    - magisk-arm64-linux
  needs:
    - job: android:ci:play-alpha
      artifacts: false
      optional: true
  variables:
    MAGISK_LINUX_APT_PACKAGES: "ripgrep"
  script:
    - bash scripts/verify_module_boundaries.sh

android:shared-compat:
  extends:
    - .magisk_android_base
    - .mipush_android_rules
  # This is compile-only and does not load Robolectric; it waits for the ARM
  # Alpha publish so it cannot consume the release runner first.
  image: "eclipse-temurin:26.0.1_8-jdk"
  stage: quality
  tags:
    - magisk-arm64-linux
  needs:
    - job: android:ci:play-alpha
      artifacts: false
      optional: true
  cache: []
  before_script:
    - !reference [.magisk_android_base, before_script]
  script:
    - bash scripts/checks/verify_shared_submodule_compat.sh
  artifacts:
    name: "MiPushFramework-shared-compat-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days

android:release:guard:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_tag_rules
  stage: release-validate
  tags:
    - magisk-arm64-linux
  script:
    - |
      set -euo pipefail
      chmod +x scripts/check_release_guard.sh
      scripts/check_release_guard.sh "$CI_COMMIT_TAG"

android:release:apk:
  extends: .magisk_android_release_apk
  resource_group: mipush-android-release-apk
  stage: release-build
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
      when: never
  needs:
    - job: android:release:guard
      artifacts: false
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      keystore_path="$CI_PROJECT_DIR/app/release.jks"
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore_path"
      chmod 0600 "$keystore_path"
      bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
        --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
        --output "$CI_PROJECT_DIR/play-release.env" \
        --initial-version-code "$MAGISK_PLAY_INITIAL_VERSION_CODE"
      source "$CI_PROJECT_DIR/play-release.env"
      KEYSTORE_FILE="$keystore_path" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
          :app:assembleRelease \
          :mipush:assembleGithubRelease \
          -PversionName="$MAGISK_PLAY_VERSION_NAME" \
          -PversionCode="$MAGISK_PLAY_VERSION_CODE" \
          -PbuildSplits=true \
          -Pkotlin.incremental=false
      chmod +x "$MAGISK_CI_TOOLKIT_DIR/release/validate_android_apk_signatures.sh"
      MAGISK_ANDROID_RELEASE_APK_ROOTS="${MAGISK_ANDROID_RELEASE_APK_ROOTS:-app/build/outputs/apk}" \
        bash "$MAGISK_CI_TOOLKIT_DIR/release/validate_android_apk_signatures.sh"
  artifacts:
    name: "MiPushFramework-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip
      - app/build/outputs/mapping/**/mapping.txt
      - mipush/build/outputs/apk/**/release/*.apk

android:release:play-bundle:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  resource_group: mipush-android-release-play
  stage: release-build
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  needs:
    - job: android:release:guard
      artifacts: false
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      keystore_path="$CI_PROJECT_DIR/app/release.jks"
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore_path"
      chmod 0600 "$keystore_path"
      bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
        --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
        --output "$CI_PROJECT_DIR/play-release.env" \
        --initial-version-code "$MAGISK_PLAY_INITIAL_VERSION_CODE"
      source "$CI_PROJECT_DIR/play-release.env"
      KEYSTORE_FILE="$keystore_path" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
          :mipush:bundlePlayRelease \
          -PversionName="$MAGISK_PLAY_VERSION_NAME" \
          -PversionCode="$MAGISK_PLAY_VERSION_CODE"
  artifacts:
    name: "MiPushFramework-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - mipush/build/outputs/bundle/**/*.aab
      - mipush/build/outputs/mapping/**/mapping.txt
      - mipush/build/outputs/native-debug-symbols/**/native-debug-symbols.zip
      - play-release.env

android:release:gitlab:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_owner_rules
  resource_group: mipush-android-release-publish
  stage: release-publish
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  needs:
    - job: android:release:apk
      artifacts: true
    - job: zygisk:build:release
      artifacts: true
  script:
    - |
      set -euo pipefail
      chmod +x scripts/publish_mipush_release.sh
      scripts/publish_mipush_release.sh gitlab-release

android:release:play:
  extends: .magisk_android_publish_play
  resource_group: mipush-android-release-play
  stage: release-publish
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - when: never
  before_script:
    - !reference [.magisk_linux_base, before_script]
    - |
      set -euo pipefail
      output_root="$CI_PROJECT_DIR/app/build/outputs"
      mkdir -p "$output_root"

      # The inherited publisher searches app/build with find, which does not
      # traverse a symlink used as its starting path. Materialize the needed
      # artifact directories instead of linking mipush outputs into app.
      rm -rf "$output_root/bundle" "$output_root/mapping" "$output_root/native-debug-symbols"
      cp -a "$CI_PROJECT_DIR/mipush/build/outputs/bundle" "$output_root/bundle"
      if [ -d "$CI_PROJECT_DIR/mipush/build/outputs/mapping" ]; then
        cp -a "$CI_PROJECT_DIR/mipush/build/outputs/mapping" "$output_root/mapping"
      fi
      if [ -d "$CI_PROJECT_DIR/mipush/build/outputs/native-debug-symbols" ]; then
        cp -a "$CI_PROJECT_DIR/mipush/build/outputs/native-debug-symbols" "$output_root/native-debug-symbols"
      fi
  needs:
    - job: android:release:play-bundle
      artifacts: true
  artifacts:
    reports:
      dotenv: play-release-status.env
    paths:
      - play-release-status.env
    when: always
    expire_in: 1 day

android:ci:play-alpha-bundle:
  extends: .magisk_android_base
  resource_group: mipush-android-release-play
  stage: release-build
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != "" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - when: never
  script:
    - |
      set -euo pipefail
      keystore_path="$CI_PROJECT_DIR/app/release.jks"
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore_path"
      chmod 0600 "$keystore_path"
      bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
        --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
        --output "$CI_PROJECT_DIR/play-release.env" \
        --initial-version-code "$MAGISK_PLAY_INITIAL_VERSION_CODE"
      source "$CI_PROJECT_DIR/play-release.env"
      KEYSTORE_FILE="$keystore_path" STORE_PASSWORD="$STORE_PASSWORD" KEY_ALIAS="$KEY_ALIAS" KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
          :mipush:bundlePlayRelease -PversionName="$MAGISK_PLAY_VERSION_NAME" -PversionCode="$MAGISK_PLAY_VERSION_CODE"
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - mipush/build/outputs/bundle/**/*.aab
      - mipush/build/outputs/mapping/**/mapping.txt
      - mipush/build/outputs/native-debug-symbols/**/native-debug-symbols.zip
      - play-release.env

android:ci:play-alpha:
  extends: .magisk_android_base
  resource_group: mipush-android-release-play
  stage: release-publish
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - when: never
  needs:
    - job: android:ci:play-alpha-bundle
      artifacts: true
  script:
    - |
      set -euo pipefail
      set -a
      source play-release.env
      set +a
      export MAGISK_PLAY_AAB_FILE="$(find mipush/build/outputs/bundle -type f -name '*.aab' | sort | head -n 1)"
      export MAGISK_PLAY_TITLE="MiPush Manager"
      export MAGISK_PLAY_SHORT_DESCRIPTION="System-level Xiaomi push service for non-MIUI Android devices."
      export MAGISK_PLAY_FULL_DESCRIPTION="MiPush Manager provides a system-level Xiaomi push service for non-MIUI Android devices. It centralizes Xiaomi push connections, improves notification compatibility, and offers runtime diagnostics and configuration controls."
      export MAGISK_PLAY_MAPPING_FILE="$(find mipush/build/outputs/mapping -type f -name mapping.txt | sort | head -n 1 || true)"
      export MAGISK_PLAY_SYMBOLS_FILE="$(find mipush/build/outputs/native-debug-symbols -type f -name native-debug-symbols.zip 2>/dev/null | sort | head -n 1 || true)"
      export MAGISK_RELEASE_ENV_FILE=play-release-status.env
      bash "$MAGISK_CI_TOOLKIT_DIR/release/publish_play.sh"
  artifacts:
    reports:
      dotenv: play-release-status.env
    paths:
      - play-release-status.env
    when: always
    expire_in: 1 day

telegram:release:
  extends: .magisk_telegram_release
  resource_group: mipush-android-release-publish
  stage: notify
  allow_failure: true
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
      allow_failure: true
    - when: never
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #MiPushFramework"
    MAGISK_TELEGRAM_PROJECT_NAME: "MiPushFramework"
    MAGISK_TELEGRAM_RELEASE_ARTIFACT_PATTERNS: |-
      *arm64-v8a*.apk
      arm64-v8a_*.zip
  needs:
    - job: android:release:apk
      artifacts: true
    - job: zygisk:build:release
      artifacts: true
    - job: android:release:play
      artifacts: false
      optional: true

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  interruptible: false
  stage: maintenance
  tags:
    - magisk-arm64-linux
