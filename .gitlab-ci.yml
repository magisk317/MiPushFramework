include:
  - project: magisk3171/magisk-ci-toolkit
    ref: 1d564d6896ee01484ba78f75587c6ab3efa178aa
    file: /.gitlab/ci/android.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: 1d564d6896ee01484ba78f75587c6ab3efa178aa
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: 1d564d6896ee01484ba78f75587c6ab3efa178aa
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: 1d564d6896ee01484ba78f75587c6ab3efa178aa
    file: /.gitlab/ci/renovate.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  # AGP 9.3.1 / Android 37 host tools used here require the AMD64 runner.
  tags:
    - magisk-amd64-linux

stages:
  - build
  - package
  - quality
  - notify
  - release-validate
  - release-build
  - release-publish
  - maintenance

variables:
  MAGISK_CI_TOOLKIT_REF: "1d564d6896ee01484ba78f75587c6ab3efa178aa"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.0"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "io.github.magisk317.mipush"
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "true"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/MiPushFramework"
  MIPUSH_ZYGISK_REPOSITORY: "https://gitlab.com/magisk3171/MiPushZygisk.git"
  # Pin the external source so an old tag cannot change when MiPushZygisk/main advances.
  MIPUSH_ZYGISK_REF: "3085c59d43c4e328369eadbcf6c1c079479b0d8f"
  MIPUSH_ZYGISK_NDK_VERSION: "r27d"
  MIPUSH_ZYGISK_NDK_HOME: "$CI_PROJECT_DIR/.android/android-ndk-r27d"
  # Public SHA-256 fingerprint of the production APK signing certificate.
  MAGISK_ANDROID_RELEASE_CERT_SHA256: "027b936e1d82a606d83599548b8b11e49a2c8ae2588c4a9fbe8311e2c54f103a"
  MAGISK_ANDROID_RELEASE_APK_ROOTS: "app/build/outputs/apk mipush/build/outputs/apk"

.mipush_android_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

.mipush_signed_android_rules:
  rules:
    - if: '$RELEASE_KEYSTORE == "" || $STORE_PASSWORD == "" || $KEY_ALIAS == "" || $KEY_PASSWORD == ""'
      when: never
    - !reference [.mipush_android_rules, rules]

.mipush_package_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
    - when: never

android:build:
  extends:
    - .magisk_android_build
    - .mipush_signed_android_rules
  variables:
    MAGISK_BUILD_TIMESTAMP: "$CI_PIPELINE_CREATED_AT"
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:assembleDebug
      :mipush:assembleGithubDebug
      -PbuildSplits
      -PminifyDebug
      -Pkotlin.incremental=false
  artifacts:
    name: "MiPushFramework-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/**/debug/*.apk
      - mipush/build/outputs/apk/**/debug/*.apk

.mipush_zygisk_build:
  extends: .mipush_package_rules
  image: "rust:1.97.1-bookworm"
  stage: build
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    ANDROID_NDK_HOME: "$MIPUSH_ZYGISK_NDK_HOME"
    MIPUSH_ZYGISK_PACKAGE_UNIVERSAL: "false"
  cache:
    key: "zygisk-cargo-$MIPUSH_ZYGISK_RUNNER_GROUP-$CI_COMMIT_REF_SLUG-$MIPUSH_ZYGISK_REF"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - MiPushZygisk/module/target/
  before_script:
    - |
      set -euo pipefail
      if ! command -v git >/dev/null 2>&1; then
        echo "SKIP Zygisk build; git is unavailable on this runner."
        mkdir -p MiPushZygisk/build
        printf '%s\n' "source-unavailable" > MiPushZygisk/build/.zygisk-skip
        exit 0
      fi

      set +e
      scripts/resolve_zygisk_source.sh "$CI_PROJECT_DIR/MiPushZygisk" >/dev/null
      resolve_status="$?"
      set -e
      if [[ "$resolve_status" -eq 2 ]]; then
        echo "SKIP Zygisk build; pinned source is unavailable on this runner."
        mkdir -p MiPushZygisk/build
        printf '%s\n' "source-unavailable" > MiPushZygisk/build/.zygisk-skip
        exit 0
      elif [[ "$resolve_status" -ne 0 ]]; then
        echo "ERROR: failed to resolve the pinned MiPushZygisk source" >&2
        exit "$resolve_status"
      fi

      export DEBIAN_FRONTEND=noninteractive
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [[ "$use_mirror" == "true" ]]; then
        sed -i \
          -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
          -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      fi
      if [[ "$use_mirror" == "true" ]]; then
        if ! apt-get update; then
          echo "Mirror apt-get update failed, falling back to official sources" >&2
          sed -i \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian-security#http://deb.debian.org/debian-security#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian#http://deb.debian.org/debian#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get update
        fi
      else
        apt-get update
      fi
    - apt-get install -y --no-install-recommends ca-certificates clang curl git lld unzip zip
    - |
      set -euo pipefail
      mkdir -p "$CARGO_HOME"
      cat > "$CARGO_HOME/config.toml" <<'EOF'
      [net]
      git-fetch-with-cli = true
      EOF
      if [[ "$use_mirror" == "true" ]]; then
        cat >> "$CARGO_HOME/config.toml" <<'EOF'

      [source.crates-io]
      replace-with = "tuna"

      [source.tuna]
      registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
      EOF
      fi
    - |
      set -euo pipefail
      if [[ "$use_mirror" == "true" ]]; then
        export RUSTUP_DIST_SERVER="https://mirrors.tuna.tsinghua.edu.cn/rustup"
        export RUSTUP_UPDATE_ROOT="https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup"
      else
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
      fi
      if ! rustup target add $MIPUSH_ZYGISK_RUST_TARGETS; then
        echo "Rustup mirror failed, falling back to official server" >&2
        export RUSTUP_DIST_SERVER="https://static.rust-lang.org"
        export RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup"
        rustup target add $MIPUSH_ZYGISK_RUST_TARGETS
      fi
    - mkdir -p .android
    - |
      set -euo pipefail
      if [ ! -d "$ANDROID_NDK_HOME" ]; then
        curl --retry 5 --retry-all-errors --continue-at - --fail --location --silent --show-error \
          "https://dl.google.com/android/repository/android-ndk-${MIPUSH_ZYGISK_NDK_VERSION}-linux.zip" \
          --output /tmp/android-ndk.zip
        unzip -q /tmp/android-ndk.zip -d .android
      fi
  script:
    - |
      set -euo pipefail
      if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        export MAGISK_BUILD_TYPE=release
        unset MAGISK_BUILD_TIMESTAMP
      else
        export MAGISK_BUILD_TYPE=debug
        export MAGISK_BUILD_TIMESTAMP="$CI_PIPELINE_CREATED_AT"
      fi
      source scripts/resolve_zygisk_version_env.sh
      cd MiPushZygisk
      ./build.sh
  artifacts:
    name: "MiPushFramework-zygisk-$MIPUSH_ZYGISK_RUNNER_GROUP-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - MiPushZygisk/build/*.zip
      - MiPushZygisk/magisk/zygisk/*.so
      - MiPushZygisk/build/.zygisk-skip

zygisk:build:arm:
  extends: .mipush_zygisk_build
  tags:
    - magisk-arm64-linux
  variables:
    MIPUSH_ZYGISK_RUNNER_GROUP: "arm"
    MIPUSH_ZYGISK_BUILD_ABIS: "arm64-v8a armeabi-v7a"
    MIPUSH_ZYGISK_RUST_TARGETS: "aarch64-linux-android armv7-linux-androideabi"

zygisk:build:x86:
  extends: .mipush_zygisk_build
  tags:
    - magisk-amd64-linux
  variables:
    MIPUSH_ZYGISK_RUNNER_GROUP: "x86"
    MIPUSH_ZYGISK_BUILD_ABIS: "x86 x86_64"
    MIPUSH_ZYGISK_RUST_TARGETS: "i686-linux-android x86_64-linux-android"

zygisk:package:universal:
  extends:
    - .magisk_linux_base
    - .mipush_package_rules
  stage: package
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_LINUX_APT_PACKAGES: "zip"
  needs:
    - job: zygisk:build:arm
      artifacts: true
    - job: zygisk:build:x86
      artifacts: true
  script:
    - |
      set -euo pipefail
      zygisk_dir="$CI_PROJECT_DIR/MiPushZygisk"
      skip_marker="$zygisk_dir/build/.zygisk-skip"
      mapfile -t split_zips < <(find "$zygisk_dir/build" -maxdepth 1 -type f -name '*.zip' 2>/dev/null | sort)
      mapfile -t split_libraries < <(find "$zygisk_dir/magisk/zygisk" -maxdepth 1 -type f -name '*.so' 2>/dev/null | sort)

      if [[ -f "$skip_marker" ]]; then
        if [[ "${#split_zips[@]}" -ne 0 || "${#split_libraries[@]}" -ne 0 ]]; then
          echo "ERROR: partial Zygisk build produced assets together with a skip marker" >&2
          exit 1
        fi
        echo "SKIP Zygisk universal package; source was unavailable to both build jobs."
        exit 0
      fi
      if [[ "${#split_zips[@]}" -ne 4 || "${#split_libraries[@]}" -ne 4 ]]; then
        echo "ERROR: expected four split Zygisk ZIPs and libraries before universal packaging" >&2
        exit 1
      fi

      library_tmp="$(mktemp -d)"
      cp "${split_libraries[@]}" "$library_tmp/"
      scripts/resolve_zygisk_source.sh "$zygisk_dir" >/dev/null
      mkdir -p "$zygisk_dir/magisk/zygisk"
      cp "$library_tmp"/*.so "$zygisk_dir/magisk/zygisk/"

      if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        export MAGISK_BUILD_TYPE=release
        unset MAGISK_BUILD_TIMESTAMP
      else
        export MAGISK_BUILD_TYPE=debug
        export MAGISK_BUILD_TIMESTAMP="$CI_PIPELINE_CREATED_AT"
      fi
      source scripts/resolve_zygisk_version_env.sh
      cd "$zygisk_dir"
      MIPUSH_ZYGISK_SKIP_BUILD=true MIPUSH_ZYGISK_PACKAGE_UNIVERSAL=true ./build.sh
  artifacts:
    name: "MiPushFramework-zygisk-universal-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - MiPushZygisk/build/universal_*.zip
      - MiPushZygisk/build/.zygisk-skip

telegram:ci:
  extends:
    - .magisk_telegram_ci
    - .mipush_signed_android_rules
  stage: notify
  allow_failure: true
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #MiPushFramework"
    MAGISK_TELEGRAM_PROJECT_NAME: "MiPushFramework"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
    MAGISK_TELEGRAM_CI_ARTIFACT_PATTERNS: |-
      *arm64-v8a*.apk
      arm64-v8a_*.zip
  needs:
    - job: android:build
      artifacts: true
      optional: false
    - job: android:test
      artifacts: false
      optional: false
    - job: zygisk:package:universal
      artifacts: true
      optional: false
    - job: zygisk:build:arm
      artifacts: true
      optional: true

android:detekt:
  extends:
    - .magisk_android_detekt
    - .mipush_android_rules
  stage: quality
  tags:
    - magisk-arm64-linux
  needs: []
  variables:
    MAGISK_ANDROID_DETEKT_TASKS: >-
      detekt
      qualityGateDetekt
      -PminifyDebug
      -Pkotlin.incremental=false
  artifacts:
    name: "MiPushFramework-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

android:test:
  extends:
    - .magisk_android_base
    - .mipush_android_rules
  # Robolectric 4.16 native SQLite teardown is unstable on JDK 26.
  image: "eclipse-temurin:25-jdk"
  stage: quality
  needs: []
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
        --no-parallel \
        :common:check \
        :xmsf:testNormalDebugUnitTest \
        :xmsf:testVc105DebugUnitTest \
        testDebugUnitTest \
        qualityGateKoverVerify \
        -PminifyDebug \
        -Pkotlin.incremental=false \
        -x detekt \
        -x qualityGateDetekt
  artifacts:
    name: "MiPushFramework-test-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - "**/build/test-results/test*/TEST-*.xml"

android:shared-compat:
  extends:
    - .magisk_android_base
    - .mipush_android_rules
  # This job also executes the xmsf Robolectric suite.
  image: "eclipse-temurin:25-jdk"
  stage: quality
  needs: []
  script:
    - bash scripts/checks/verify_shared_submodule_compat.sh
  artifacts:
    name: "MiPushFramework-shared-compat-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - "**/build/test-results/test*/TEST-*.xml"

android:release:guard:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_tag_rules
  stage: release-validate
  tags:
    - magisk-arm64-linux
  script:
    - |
      set -euo pipefail
      chmod +x scripts/check_release_guard.sh
      scripts/check_release_guard.sh "$CI_COMMIT_TAG"

android:release:apk:
  extends: .magisk_android_release_apk
  resource_group: mipush-android-release-apk
  stage: release-build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
      when: never
  variables:
    MAGISK_ANDROID_RELEASE_APK_TASKS: >-
      :app:assembleRelease
      :mipush:assembleGithubRelease
      -PbuildSplits=true
      -Pkotlin.incremental=false
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "MiPushFramework-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip
      - app/build/outputs/mapping/**/mapping.txt
      - mipush/build/outputs/apk/**/release/*.apk

android:release:play-bundle:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  resource_group: mipush-android-release-play
  stage: release-build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  needs:
    - job: android:release:guard
      artifacts: false
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      keystore_path="$CI_PROJECT_DIR/app/release.jks"
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore_path"
      chmod 0600 "$keystore_path"
      KEYSTORE_FILE="$keystore_path" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS :mipush:bundlePlayRelease
  artifacts:
    name: "MiPushFramework-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - mipush/build/outputs/bundle/**/*.aab
      - mipush/build/outputs/mapping/**/mapping.txt
      - mipush/build/outputs/native-debug-symbols/**/native-debug-symbols.zip

android:release:gitlab:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_owner_rules
  resource_group: mipush-android-release-publish
  stage: release-publish
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  needs:
    - job: android:release:apk
      artifacts: true
    - job: zygisk:build:arm
      artifacts: true
    - job: zygisk:build:x86
      artifacts: true
    - job: zygisk:package:universal
      artifacts: true
  script:
    - |
      set -euo pipefail
      chmod +x scripts/publish_mipush_release.sh
      scripts/publish_mipush_release.sh gitlab-release

android:release:play:
  extends: .magisk_android_publish_play
  resource_group: mipush-android-release-play
  stage: release-publish
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - when: never
  before_script:
    - !reference [.magisk_linux_base, before_script]
    - |
      set -euo pipefail
      mkdir -p app/build/outputs
      ln -s "$CI_PROJECT_DIR/mipush/build/outputs/bundle" app/build/outputs/bundle
      if [ -d "$CI_PROJECT_DIR/mipush/build/outputs/mapping" ]; then
        ln -s "$CI_PROJECT_DIR/mipush/build/outputs/mapping" app/build/outputs/mapping
      fi
      if [ -d "$CI_PROJECT_DIR/mipush/build/outputs/native-debug-symbols" ]; then
        ln -s "$CI_PROJECT_DIR/mipush/build/outputs/native-debug-symbols" app/build/outputs/native-debug-symbols
      fi
  needs:
    - job: android:release:play-bundle
      artifacts: true

telegram:release:
  extends: .magisk_telegram_release
  resource_group: mipush-android-release-publish
  stage: release-publish
  allow_failure: true
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #MiPushFramework"
    MAGISK_TELEGRAM_PROJECT_NAME: "MiPushFramework"
    MAGISK_TELEGRAM_RELEASE_ARTIFACT_PATTERNS: |-
      *arm64-v8a*.apk
      arm64-v8a_*.zip
  needs:
    - job: android:release:apk
      artifacts: true
    - job: zygisk:build:arm
      artifacts: true
    - job: android:release:gitlab
      artifacts: false

