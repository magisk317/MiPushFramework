include:
  - project: magisk3171/magisk-ci-toolkit
    ref: master
    file: /.gitlab/ci/android.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: master
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: master
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: master
    file: /.gitlab/ci/renovate.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - magisk-local-linux

stages:
  - build
  - quality
  - notify
  - release-validate
  - release-build
  - release-publish
  - maintenance

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.0"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "io.github.magisk317.mipush"
  MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY: "magisk317/MiPushFramework"
  MAGISK_ANDROID_RELEASE_MODULES_REPO: "Xposed-Modules-Repo/io.github.magisk317.mipush"
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "false"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/MiPushFramework"
  MIPUSH_ZYGISK_REPOSITORY: "https://gitlab.com/magisk3171/MiPushZygisk.git"
  MIPUSH_ZYGISK_REF: "main"
  MIPUSH_ZYGISK_NDK_VERSION: "r27d"
  MIPUSH_ZYGISK_NDK_HOME: "$CI_PROJECT_DIR/.android/android-ndk-r27d"

.mipush_android_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

.mipush_package_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
    - when: never

android:build:
  extends:
    - .magisk_android_build
    - .mipush_android_rules
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:assembleDebug
      :mipush:assembleDebug
      -PbuildSplits
      -PminifyDebug
      -Pkotlin.incremental=false
  artifacts:
    name: "MiPushFramework-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/**/debug/*.apk
      - mipush/build/outputs/apk/**/debug/*.apk

zygisk:build:
  extends: .mipush_package_rules
  image: "rust:1-bookworm"
  stage: build
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    ANDROID_NDK_HOME: "$MIPUSH_ZYGISK_NDK_HOME"
    RUSTUP_DIST_SERVER: "https://mirrors.tuna.tsinghua.edu.cn/rustup"
    RUSTUP_UPDATE_ROOT: "https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup"
  cache:
    key: "zygisk-cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - MiPushZygisk/module/target/
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      sed -i \
        -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
        -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
        -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
        -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
        -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
        /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git unzip zip
    - |
      set -euo pipefail
      mkdir -p "$CARGO_HOME"
      cat > "$CARGO_HOME/config.toml" <<'EOF'
      [source.crates-io]
      replace-with = "tuna"

      [source.tuna]
      registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

      [net]
      git-fetch-with-cli = true
      EOF
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - mkdir -p .android
    - |
      set -euo pipefail
      if [ ! -d "$ANDROID_NDK_HOME" ]; then
        curl --retry 5 --fail --location --silent --show-error \
          "https://dl.google.com/android/repository/android-ndk-${MIPUSH_ZYGISK_NDK_VERSION}-linux.zip" \
          --output /tmp/android-ndk.zip
        unzip -q /tmp/android-ndk.zip -d .android
      fi
  script:
    - |
      set -euo pipefail
      source scripts/resolve_zygisk_version_env.sh
      git clone --depth 1 --branch "$MIPUSH_ZYGISK_REF" "$MIPUSH_ZYGISK_REPOSITORY" MiPushZygisk
      cd MiPushZygisk
      ./build.sh
  artifacts:
    name: "MiPushFramework-zygisk-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - MiPushZygisk/build/*.zip

telegram:ci:
  extends: .magisk_telegram_ci
  stage: notify
  allow_failure: true
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #MiPushFramework"
    MAGISK_TELEGRAM_PROJECT_NAME: "MiPushFramework"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
    MAGISK_TELEGRAM_CI_ARTIFACT_PATTERNS: |-
      *arm64-v8a*.apk
      arm64-v8a_*.zip
  needs:
    - job: android:build
      artifacts: true
      optional: true
    - job: zygisk:build
      artifacts: true
      optional: true

android:detekt:
  extends:
    - .magisk_android_detekt
    - .mipush_android_rules
  stage: quality
  allow_failure: true
  needs: []
  variables:
    MAGISK_ANDROID_DETEKT_TASKS: >-
      detekt
      qualityGateDetekt
      -PminifyDebug
      -Pkotlin.incremental=false
  artifacts:
    name: "MiPushFramework-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

android:test:
  extends:
    - .magisk_android_base
    - .mipush_android_rules
  stage: quality
  allow_failure: true
  needs: []
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS \
        :common:check \
        :xmsf:testNormalDebugUnitTest \
        :xmsf:testVc105DebugUnitTest \
        testDebugUnitTest \
        -PminifyDebug \
        -Pkotlin.incremental=false \
        -x detekt \
        -x qualityGateDetekt
  artifacts:
    name: "MiPushFramework-test-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - "**/build/test-results/test*/TEST-*.xml"

android:release:guard:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  stage: release-validate
  script:
    - |
      set -euo pipefail
      chmod +x scripts/check_release_guard.sh
      scripts/check_release_guard.sh "$CI_COMMIT_TAG"

android:release:apk:
  extends: .magisk_android_release_apk
  stage: release-build
  variables:
    MAGISK_ANDROID_RELEASE_APK_TASKS: >-
      :app:assembleRelease
      :mipush:assembleRelease
      -PbuildSplits=true
      -Pkotlin.incremental=false
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "MiPushFramework-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip
      - app/build/outputs/mapping/**/mapping.txt
      - mipush/build/outputs/apk/**/release/*.apk

android:release:gitlab:
  extends: .magisk_android_base
  stage: release-publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab"'
      when: manual
      allow_failure: true
    - when: never
  needs:
    - job: android:release:apk
      artifacts: true
    - job: zygisk:build
      artifacts: true
  script:
    - |
      set -euo pipefail
      chmod +x scripts/publish_mipush_release.sh
      scripts/publish_mipush_release.sh gitlab-release

telegram:release:
  extends: .magisk_telegram_release
  stage: release-publish
  allow_failure: true
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #MiPushFramework"
    MAGISK_TELEGRAM_PROJECT_NAME: "MiPushFramework"
    MAGISK_TELEGRAM_RELEASE_ARTIFACT_PATTERNS: |-
      *arm64-v8a*.apk
      arm64-v8a_*.zip
  needs:
    - job: android:release:apk
      artifacts: true
    - job: zygisk:build
      artifacts: true

android:release:modules-repo:
  extends: .magisk_android_base
  stage: release-publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_MODULES_REPO != "" && $XPOSED_MODULES_REPO_TOKEN != ""'
      when: manual
      allow_failure: true
    - when: never
  needs:
    - job: android:release:apk
      artifacts: true
  script:
    - |
      set -euo pipefail
      install -d -m 0755 /etc/apt/keyrings
      export DEBIAN_FRONTEND=noninteractive
      sed -i \
        -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
        -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
        -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
        -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
        -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
        /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      apt-get update
      apt-get install -y --no-install-recommends gpg
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        > /etc/apt/sources.list.d/github-cli.list
      apt-get update
      apt-get install -y --no-install-recommends gh
      rm -rf /var/lib/apt/lists/*

      chmod +x scripts/publish_mipush_release.sh
      SOURCE_RELEASE_TOKEN="${SOURCE_RELEASE_TOKEN:-${GITHUB_RELEASE_TOKEN:-}}" \
        scripts/publish_mipush_release.sh modules-repo

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  stage: maintenance
